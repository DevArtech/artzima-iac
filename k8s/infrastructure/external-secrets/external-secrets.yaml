---
# External Secrets Operator: turns ExternalSecrets (k8s/secrets) into Secrets,
# reading them from Infisical. Its own Flux Kustomization (`external-secrets`)
# runs BEFORE `secrets`, which runs before the other controllers, because those
# need the Secrets (tunnel token, tailscale OAuth, grafana admin...).
# Its only credential is the Secret external-secrets/infisical-universal-auth,
# created once by `make eso-bootstrap` (docs/secrets.md). It is never in git.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "2.15.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    installCRDs: true
    replicaCount: 1
    # ServiceMonitor CRDs arrive later (kube-prometheus-stack): keep metrics
    # scraping off here to avoid an ordering loop.
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
