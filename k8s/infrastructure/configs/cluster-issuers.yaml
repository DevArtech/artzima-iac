---
# Internal CA: a self-signed root issues "artzima-ca", which signs everything.
# Trust it on your devices:
#   kubectl -n cert-manager get secret artzima-ca-root \
#     -o jsonpath='{.data.ca\.crt}' | base64 -d > artzima-ca.crt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: artzima-ca-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: artzima internal CA
  secretName: artzima-ca-root
  duration: 87600h # 10y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: artzima-ca
spec:
  ca:
    secretName: artzima-ca-root
