---
# prometheus-pve-exporter: scrapes the PVE API with the read-only
# prometheus@pve token (Secret monitoring/pve-exporter, synced by ESO from
# Infisical /k8s/monitoring/PVE_EXPORTER_TOKEN, which `make proxmox-api` writes).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: prompve/prometheus-pve-exporter
              tag: "3.12.0"
            args: ["--config.file=/etc/prometheus/pve.yml"]
    service:
      main:
        controller: main
        ports:
          http:
            port: 9221
    persistence:
      config:
        type: secret
        name: pve-exporter
        globalMounts:
          - path: /etc/prometheus/pve.yml
            subPath: pve.yml
            readOnly: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: pve-exporter
  endpoints:
    - port: http
      path: /pve
      interval: 60s
      scrapeTimeout: 30s
      params:
        target: ["${pve_api_host}"]
        module: ["default"]
        cluster: ["1"]
        node: ["1"]
