---
# NUT exporter: reads the UPS status from upsd on ${nut_server_ip} (role nut, port
# 3493; reading variables needs no login) for the UPSOnBattery/UPSLowBattery alerts.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nut-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/druggeri/nut_exporter
              tag: "3.3.0"
            env:
              NUT_EXPORTER_SERVER: "${nut_server_ip}"
              NUT_EXPORTER_SERVERPORT: "3493"
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
    service:
      main:
        controller: main
        ports:
          http:
            port: 9199
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nut-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: nut-exporter
  endpoints:
    - port: http
      path: /ups_metrics
      interval: 30s
      params:
        ups: ["${nut_ups_name}"]
