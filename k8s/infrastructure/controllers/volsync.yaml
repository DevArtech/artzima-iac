---
# VolSync (backube): declarative, scheduled backups of PVCs with its restic mover.
# Every source is a ReplicationSource generated from ansible/group_vars/all/backups.yml
# (k8s/apps/backups/volsync.yaml), writing to the Backblaze B2 restic bucket.
# Why VolSync over hand-written restic/Kopia CronJobs: docs/decisions.md "Off-site backups".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 1h
  chart:
    spec:
      chart: volsync
      version: "0.17.0"
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    manageCRDs: true
