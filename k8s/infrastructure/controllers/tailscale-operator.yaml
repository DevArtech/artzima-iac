---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: "1.104.7"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # OAuth client: the chart uses the pre-existing Secret tailscale/operator-oauth
  # (ESO, from Infisical /k8s/tailscale: k8s/secrets/tailscale/operator-oauth.yaml).
  values:
    operatorConfig:
      hostname: artzima-k8s-operator
    apiServerProxyConfig:
      mode: "true"
