---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.9.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    # Talos binds kube-controller-manager and kube-scheduler metrics to 127.0.0.1 (and kube-proxy's
    # too), so Prometheus can't scrape them: they only ever raised false "unreachable"/TargetDown
    # alerts. Off, with their rules (below). To monitor them, bind them to 0.0.0.0 in the Talos
    # machine config first (controllerManager/scheduler extraArgs bind-address, proxy
    # metrics-bind-address), then turn these back on.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: true
      service:
        port: 2381
        targetPort: 2381
    kubeProxy:
      enabled: false # Talos default: flannel + kube-proxy, metrics on 127.0.0.1 only (see above)
    defaultRules:
      rules:
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: nfs-artnas
        size: 2Gi
      # Dashboards as code: ConfigMaps labelled grafana_dashboard=1 (k8s/apps/monitoring),
      # each in the folder named by its grafana_folder annotation. The chart's own
      # dashboards have none and stay in the root folder.
      sidecar:
        dashboards:
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      grafana.ini:
        dashboards:
          default_home_dashboard_path: /tmp/dashboards/Artzima/artzima-overview.json
    # ALERTS -> ONE webhook (Infisical /k8s/alerts/WEBHOOK_URL -> Secret alert-webhook,
    # k8s/secrets/monitoring). Rules: k8s/infrastructure/configs/alerts.yaml + the chart's
    # defaults. Empty URL = nothing is sent yet (alerts still visible in Alertmanager).
    alertmanager:
      config:
        route:
          receiver: webhook
          group_by: [alertname, namespace]
          group_wait: 1m
          group_interval: 10m
          repeat_interval: 12h
          routes:
            - receiver: "null"
              matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
            - receiver: "null"
              matchers: ['severity =~ "info|none"']
        receivers:
          - name: "null"
          - name: webhook
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alert-webhook/url
                send_resolved: true
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: [namespace, alertname]
      alertmanagerSpec:
        secrets: [alert-webhook] # mounted at /etc/alertmanager/secrets/alert-webhook/
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-artnas
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
    # Status of custom resources as metrics (for alerts.yaml): Flux Kustomizations/
    # HelmReleases/sources (gotk_resource_info, Flux's documented approach), VolSync
    # last sync, CNPG last successful backup.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: [kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io, source.toolkit.fluxcd.io]
            resources: [kustomizations, helmreleases, gitrepositories, helmrepositories, ocirepositories]
            verbs: [list, watch]
          - apiGroups: [volsync.backube]
            resources: [replicationsources]
            verbs: [list, watch]
          - apiGroups: [postgresql.cnpg.io]
            resources: [clusters]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: { group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization }
                metricNamePrefix: gotk
                labelsFromPath: &flux_labels
                  name: [metadata, name]
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                # `revision` lives at a different path per kind; a path that does not
                # exist drops the whole series (one shared path left only Kustomizations).
                metrics:
                  - name: resource_info
                    help: The current state of a Flux resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          revision: [status, lastAppliedRevision]
              - groupVersionKind: { group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease }
                metricNamePrefix: gotk
                labelsFromPath: *flux_labels
                metrics:
                  - name: resource_info
                    help: The current state of a Flux resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          revision: [status, history, "0", chartVersion]
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository }
                metricNamePrefix: gotk
                labelsFromPath: *flux_labels
                metrics: &flux_source_metrics
                  - name: resource_info
                    help: The current state of a Flux resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          revision: [status, artifact, revision]
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository }
                metricNamePrefix: gotk
                labelsFromPath: *flux_labels
                metrics: *flux_source_metrics
              - groupVersionKind: { group: volsync.backube, version: v1alpha1, kind: ReplicationSource }
                metricNamePrefix: artzima_volsync
                labelsFromPath:
                  name: [metadata, name]
                  exported_namespace: [metadata, namespace]
                metrics:
                  - name: last_sync_timestamp_seconds
                    help: Time of the last successful VolSync backup.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastSyncTime]
                  - name: paused
                    help: 1 while the source is paused (disaster-recovery switch).
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, paused]
                        nilIsZero: true
              - groupVersionKind: { group: postgresql.cnpg.io, version: v1, kind: Cluster }
                metricNamePrefix: artzima_cnpg
                labelsFromPath:
                  name: [metadata, name]
                  exported_namespace: [metadata, namespace]
                metrics:
                  - name: last_successful_backup_timestamp_seconds
                    help: Time of the last successful CNPG backup (any method).
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastSuccessfulBackup]
    prometheus:
      prometheusSpec:
        retention: 15d
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-artnas
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 30Gi
