---
# Home Assistant OS VM on host01, outside Kubernetes, published via Traefik
# (route generated from /apps.yaml).
# HA rejects proxied requests unless configured (docs/manual-steps.md and
# docs/addresses.md for the generated snippet):
#   http:
#     use_x_forwarded_for: true
#     trusted_proxies: [<Talos node IPs>]
# Websockets (the HA frontend) work through Traefik and the tunnel unchanged.
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: external
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: ${haos_port}
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homeassistant-1
  namespace: external
  labels:
    kubernetes.io/service-name: homeassistant
    endpointslice.kubernetes.io/managed-by: flux.artzima
addressType: IPv4
ports:
  - name: http
    port: ${haos_port}
    protocol: TCP
endpoints:
  - addresses:
      - ${haos_ip}
    conditions:
      ready: true
