---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - setup.yaml # idempotent first-run Job (admin, Jellyfin server, libraries)
generatorOptions:
  disableNameSuffixHash: true # the Job references the ConfigMap by name
  labels:
    app.kubernetes.io/part-of: wizarr
configMapGenerator:
  - name: wizarr-scripts
    namespace: wizarr
    files:
      - setup/wizarr_setup.py
