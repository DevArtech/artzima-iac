---
# Image tag verified on ghcr.io 2026-11-23 (release v2026.10.1).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wizarr
  namespace: wizarr
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/wizarrrr/wizarr
              tag: "v2026.10.1"
            env:
              TZ: America/New_York
    service:
      main:
        controller: main
        ports:
          http:
            port: 5690
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: nfs-artnas
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data/database
