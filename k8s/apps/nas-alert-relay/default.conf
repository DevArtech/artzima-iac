# nas-alert-relay (k8s/apps/nas-alert-relay): POST /hooks/lab/<token> -> hq-egress -> HQ.
# The token is in the URL path, so nothing logs the URI: the access log has method, status
# and HQ's status only, and error_log is crit (nginx's error lines quote the request line).
log_format relay '$remote_addr $request_method $status up=$upstream_status $request_time';

server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout relay;
    error_log /dev/stderr crit;
    client_max_body_size 256k; # HQ's own limit (MAX_BODY)

    # hq-egress is an ExternalName the Tailscale operator points at its proxy: re-resolve it
    # (variable in proxy_pass) so a re-created proxy Service is picked up without a restart.
    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

    location /hooks/lab/ {
        limit_except POST { deny all; }
        set $hq hq-egress.monitoring.svc.cluster.local;
        proxy_pass http://$hq:4800; # no URI part: path and query go as they came
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
