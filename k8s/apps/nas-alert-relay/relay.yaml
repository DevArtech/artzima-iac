---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nas-alert-relay
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nas-alert-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nas-alert-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nas-alert-relay
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine3.24
          command: ["nginx", "-g", "daemon off;"] # skip the image's entrypoint scripts (they edit conf.d)
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 60
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: conf
          configMap:
            name: nas-alert-relay
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
# LAN only: kube-proxy (nftables mode) DNATs <k8s API VIP>:4800 on whichever node holds the VIP,
# so the address moves with the VIP. A NodePort would not do: in nftables mode NodePorts answer
# on each node's primary IP only. Not in /apps.yaml, no Traefik route, no tunnel.
apiVersion: v1
kind: Service
metadata:
  name: nas-alert-relay
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nas-alert-relay
spec:
  type: ClusterIP
  externalIPs:
    - ${k8s_api_vip}
  selector:
    app.kubernetes.io/name: nas-alert-relay
  ports:
    - name: http
      port: 4800 # same as HQ's; Ansible nas_backup_alert_relay_port (roles/nas_backup/defaults)
      targetPort: http
      protocol: TCP
