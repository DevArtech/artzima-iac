---
# Skyjo web app (github.com/DevArtech/skynet, web/): FastAPI API under /api and
# the built React frontend on ONE origin, port 8080 (images/skyjo).
#
# Image: PRIVATE ghcr.io/devartech/skyjo built by .github/workflows/images.yml,
# pulled with the `ghcr-pull` Secret (ESO ClusterExternalSecret k8s/secrets/ghcr-pull.yaml).
# STATELESS: the MuZero weights are baked into the image from upstream's Git LFS
# (runs/{muzero_baseline,muzero_belief}/checkpoints/checkpoint.pt, plus a
# checkpoint_iter_1.pt symlink so the backend's default lookup finds them;
# images/skyjo/Dockerfile). No volume: new weights = bump the upstream pin.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: skyjo
  namespace: skyjo
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image's `skyjo` user
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      main:
        replicas: 1 # stateless, but each replica loads the models into RAM
        containers:
          app:
            image:
              # TODO(after the first CI run): this tag exists once images.yml has
              # pushed it (tag = upstream SHA in images/skyjo/upstream.env).
              repository: ghcr.io/devartech/skyjo
              tag: e62a825d5fc1cc3e1e2d67e402254aa698eefcea
              pullPolicy: IfNotPresent
            env:
              HOME: /tmp
              # torch: match the CPU limit, avoid oversubscribing the node.
              OMP_NUM_THREADS: "2"
              MKL_NUM_THREADS: "2"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 24
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080

    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp
