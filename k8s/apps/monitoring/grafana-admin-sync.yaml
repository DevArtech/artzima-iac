---
# grafana-admin-sync: applies a change of Infisical /k8s/monitoring/GRAFANA_ADMIN_USER /
# _PASSWORD to Grafana's admin (user 1), which Grafana itself reads only when it first
# creates its database. Script: grafana-admin/sync.py (ConfigMap grafana-admin-sync).
# Like media-wiring it runs on EVERY Flux sync of `apps` (ttlSecondsAfterFinished
# deletes the finished Job, Flux re-creates it), and does nothing when they match.
# ESO refreshes grafana-admin hourly; to apply a change now: docs/manual-steps.md
# "Grafana admin login". Log: kubectl -n monitoring logs job/grafana-admin-sync
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-admin-sync
  namespace: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 900
  backoffLimit: 2
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-admin-sync
    spec:
      restartPolicy: Never
      serviceAccountName: grafana-admin-sync # patches Secret grafana-admin-applied only
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: docker.io/library/python:3.14.10-alpine3.24
          command: ["python3", "-I", "-u", "/scripts/sync.py"]
          env:
            - name: GRAFANA_URL
              value: http://kube-prometheus-stack-grafana.monitoring.svc
            - name: ADMIN_USER # wanted: Infisical (ExternalSecret grafana-admin)
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-user }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-password }
            - name: APPLIED_USER # what Grafana has now (written by this Job)
              valueFrom:
                secretKeyRef: { name: grafana-admin-applied, key: admin-user, optional: true }
            - name: APPLIED_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin-applied, key: admin-password, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: grafana-admin-sync
---
# The login Grafana currently has (so the Job can still sign in after Infisical
# changes). Created empty once; Flux never overwrites what the Job writes.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-applied
  namespace: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-admin-sync
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-admin-sync
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [grafana-admin-applied]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-admin-sync
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-admin-sync
subjects:
  - kind: ServiceAccount
    name: grafana-admin-sync
    namespace: monitoring
