---
# Home Assistant's backup folder on the NAS, exposed as a PVC so VolSync can ship it
# off-site (restic -> B2). Home Assistant itself writes its backups there: Settings ->
# System -> Storage -> Add network storage (NFS, usage "Backup", server artnas, path
# ${artnas_homeassistant_backups_path}), then make it the default backup location
# (docs/backups.md "Home Assistant"). Mounted READ-ONLY here; static PV, Retain.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homeassistant-backups
spec:
  capacity:
    storage: 50Gi # informational for NFS
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: { namespace: backup, name: homeassistant-backups }
  mountOptions: ["nfsvers=4.1", "hard", "noatime"]
  csi:
    driver: nfs.csi.k8s.io
    readOnly: true # the cluster only READS HA's backups (HA writes them over its own NFS mount)
    volumeHandle: ${artnas_ip}#${artnas_homeassistant_backups_path}##
    volumeAttributes:
      server: ${artnas_ip}
      share: ${artnas_homeassistant_backups_path}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-backups
  namespace: backup
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: homeassistant-backups
  resources:
    requests:
      storage: 50Gi
