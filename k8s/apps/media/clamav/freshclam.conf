# freshclam for the media namespace (k8s/apps/media/clamav.yaml, ConfigMap clamav-config).
# Runs as a daemon in its own container (`--checks 4`: every 6 h) and updates the
# signatures in the shared emptyDir /var/lib/clamav; clamd reloads them (SelfCheck).
# No DatabaseOwner / NotifyClamd: it already runs as the clamav user, and clamd
# notices new files by itself.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
Foreground yes
LogTime yes
# Only diffs (.cdiff) after the first sync, which keeps the CDN happy.
ScriptedUpdates yes
# No test load of every new database: that would hold a second ~1 GiB signature set in
# this container. The files are signed and verified by freshclam anyway.
TestDatabases no
ConnectTimeout 60
