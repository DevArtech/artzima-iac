# clamd for the media namespace (k8s/apps/media/clamav.yaml, ConfigMap clamav-config).
# Replaces the image's /etc/clamav/clamd.conf: no `User` (the pod already runs as the
# image's clamav user, uid 100) and no local socket (only TCP, the Service clamav:3310).
# Clients: SABnzbd's post-processing script (k8s/apps/media/sabnzbd/clamav-scan.py,
# INSTREAM). Changes reach clamd on the next pod start:
#   kubectl -n media rollout restart deploy/clamav
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
# No LogFile: in the foreground clamd logs to the container's output.
LogTime yes
LogClean no
ExtendedDetectionInfo yes

# Signatures: freshclam (the other container) replaces the files; clamd checks every
# 10 min and reloads. Non-concurrent reload: scans wait ~1 min instead of clamd holding
# two signature sets at once (that would double its ~1.3 GiB and hit the memory limit).
SelfCheck 600
ConcurrentDatabaseReload no

# Few parallel scans (one SABnzbd job at a time, one file per connection).
MaxThreads 4
MaxConnectionQueueLength 20
ReadTimeout 300
CommandReadTimeout 30
IdleTimeout 60

# Sizes: the script sends at most 512 MiB per file (CLAMSCAN_MAX_MIB); keep these above it,
# else clamd skips the rest silently (MaxFileSize) or refuses the stream.
StreamMaxLength 520M
MaxFileSize 520M
MaxScanSize 1000M

# Encrypted archives inside a job are a classic malware wrapper (SABnzbd already aborts
# password-protected RARs; this catches zip/7z and nested ones).
AlertEncryptedArchive yes
