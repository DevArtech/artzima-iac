---
# Prowlarr (indexers, synced to Sonarr and Radarr), k8s/apps/media. NOT public:
# tailnet only, via the Tailscale operator (Service annotation below -> http://prowlarr:9696 on the
# tailnet, MagicDNS). Image: home-operations (rootless; runs as media_puid:media_pgid).
# API key pre-seeded from Infisical /k8s/media/PROWLARR_API_KEY (PROWLARR__AUTH__APIKEY);
# Sonarr/Radarr added as apps (indexer sync) by the media-wiring Job.
# First login: create the UI user (docs/manual-steps.md §10).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: ${media_puid}
        runAsGroup: ${media_pgid}
        fsGroup: ${media_pgid}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      prowlarr:
        replicas: 1 # config.xml on an RWO volume; the DB is Postgres (arr-db)
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: "3.0.2.5780"
            env:
              TZ: ${timezone}
              UMASK: "002" # TRaSH: group-writable files for the shared media group
              PROWLARR__APP__INSTANCENAME: Prowlarr
              PROWLARR__SERVER__PORT: "9696"
              PROWLARR__AUTH__METHOD: Forms
              PROWLARR__AUTH__REQUIRED: Enabled
              PROWLARR__LOG__DBENABLED: "False"
              # Database: Postgres (CNPG arr-db, database.yaml), not SQLite on NFS.
              PROWLARR__POSTGRES__HOST: arr-db-rw # CNPG read-write Service
              PROWLARR__POSTGRES__PORT: "5432"
              PROWLARR__POSTGRES__MAINDB: prowlarr
              PROWLARR__POSTGRES__USER:
                valueFrom:
                  secretKeyRef:
                    name: arr-db-app
                    key: username
              PROWLARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: arr-db-app
                    key: password
              PROWLARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: media-apikeys
                    key: PROWLARR_API_KEY
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 9696
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 9696
                  periodSeconds: 5
                  failureThreshold: 60 # first start migrates the database
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 25m
                memory: 160Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: prowlarr
        forceRename: prowlarr
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: prowlarr
        ports:
          http:
            port: 9696
    persistence:
      config: # NAS /volume1/Artzima/k8s/media/prowlarr (config.xml, logs, covers; old SQLite files unused)
        type: persistentVolumeClaim
        storageClass: nfs-artnas
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
