---
# Sonarr (TV), k8s/apps/media. NOT public: tailnet only, via the
# Tailscale operator (Service annotation below -> http://sonarr:8989 on the
# tailnet, MagicDNS). Image: home-operations (rootless; runs as media_puid:media_pgid).
# API key pre-seeded from Infisical /k8s/media/SONARR_API_KEY (SONARR__AUTH__APIKEY);
# wiring (download client, Jellyfin, Prowlarr, ...) by the media-wiring Job.
# First login: create the UI user (docs/manual-steps.md §10).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: ${media_puid}
        runAsGroup: ${media_pgid}
        fsGroup: ${media_pgid}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      sonarr:
        replicas: 1 # SQLite on RWO: one writer
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: "4.0.20.3012" # last v4 build of this image (it now tracks v5 pre-releases)
            env:
              TZ: ${timezone}
              UMASK: "002" # TRaSH: group-writable files for the shared media group
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__SERVER__PORT: "8989"
              SONARR__AUTH__METHOD: Forms
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__LOG__DBENABLED: "False"
              SONARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: media-apikeys
                    key: SONARR_API_KEY
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                  periodSeconds: 5
                  failureThreshold: 60 # first start migrates the database
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: sonarr
        forceRename: sonarr
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: sonarr
        ports:
          http:
            port: 8989
    persistence:
      config: # NAS /volume1/Artzima/k8s/media/sonarr (SQLite + backups)
        type: persistentVolumeClaim
        storageClass: nfs-artnas
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /config
      data: # the shared TRaSH volume (storage.yaml)
        type: persistentVolumeClaim
        existingClaim: media-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
