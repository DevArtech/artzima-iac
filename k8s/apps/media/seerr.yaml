---
# Seerr (seerr-team: the merged successor of Overseerr and Jellyseerr): media
# requests, sign-in with Jellyfin accounts. The ONLY public media app:
# /apps.yaml entry `seerr` -> https://seerr.<domain> (Cloudflare Tunnel -> Traefik
# -> this Service). Optional Cloudflare Access: docs/manual-steps.md §10.
#
# API key: Infisical /k8s/media/SEERR_API_KEY, seeded into a NEW settings.json by
# the init container and enforced on every start by the API_KEY env var. No setup
# wizard by hand: the media-wiring Job (wiring/wire.py "Seerr setup") signs in once
# with the Jellyfin admin login (Infisical /k8s/media/JELLYFIN_ADMIN_*, copies that
# `make jellyfin` writes), sets the Jellyfin server, libraries and application URL,
# marks Seerr initialized, and adds Sonarr and Radarr.
#
# Database: CNPG Cluster seerr-db (database.yaml), credentials from the
# CNPG-generated Secret seerr-db-app, instead of Seerr's default SQLite (WAL/-shm)
# on the NFSv3 config PVC. The config PVC keeps settings.json and logs only.
# Env names: docs.seerr.dev "extending-seerr/database-config".
# seed-config also writes main.mediaServerType (wiring/seed.py): without it Seerr
# takes a new settings.json for an Overseerr install and its merge crashes on a
# brand-new database ("Failed to insert migration records").
#
# Image: OUR patched Seerr, ghcr.io/devartech/seerr:<upstream tag>-artzima.<n>
# (private package, pulled with ghcr-pull). It is upstream's release plus one
# feature, the "External list" Discover row (DevArtech/artzima-images,
# patches/seerr/README.md). The row's URL template is fetched server-side per
# viewer, and ONLY from the hosts in SEERR_EXTERNAL_LIST_HOSTS (exact host:port;
# empty = off). The media-wiring Job creates the "For you" row, which points at
# the recs service. Updates: Renovate bumps the upstream tag in artzima-images;
# CI applies the patches and runs Seerr's tests; a new image tag reaches this
# file through Renovate (tag + digest, custom versioning in renovate.json).
# If the patches stop applying, no image is built and this pin stays put.
# Going back to stock Seerr = ghcr.io/seerr-team/seerr:<same upstream tag>.
# The DB is unchanged by the patch: the new row type is just a number in
# discover_slider.type, and stock Seerr renders nothing for a type it does not know.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-pull # private ghcr.io/devartech/seerr (k8s/secrets/ghcr-pull.yaml)
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user (fixed by the image, not media_puid)
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      seerr:
        replicas: 1 # settings.json on an RWO volume; the DB is Postgres (seerr-db)
        strategy: Recreate
        initContainers:
          seed-config:
            image:
              repository: docker.io/library/python
              tag: 3.14.10-alpine3.24
            command: ["python3", "-I", "/scripts/seed.py", "seerr"]
            env:
              SEERR_API_KEY: &apiKey
                valueFrom:
                  secretKeyRef:
                    name: media-apikeys
                    key: SEERR_API_KEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: ghcr.io/devartech/seerr
              tag: v3.5.2-artzima.1@sha256:DIGEST_PENDING
            env:
              TZ: ${timezone}
              LOG_LEVEL: info
              PORT: "5055"
              # External list rows may only fetch from these hosts (exact host:port):
              # the recs service (personal recommendations, the "For you" row).
              SEERR_EXTERNAL_LIST_HOSTS: recs.media.svc.cluster.local:8080
              API_KEY: *apiKey
              DB_TYPE: postgres
              DB_HOST: seerr-db-rw # CNPG read-write Service
              DB_PORT: "5432"
              DB_NAME: seerr
              DB_USE_SSL: "false" # in-cluster; the Seerr default, explicit for clarity
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: seerr-db-app
                    key: username
              DB_PASS:
                valueFrom:
                  secretKeyRef:
                    name: seerr-db-app
                    key: password
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: 5055
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: 5055
                  periodSeconds: 5
                  failureThreshold: 60 # first start / migrations
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false # Next.js writes its cache in the app dir
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: seerr
        forceRename: seerr # = the /apps.yaml entry's service
        ports:
          http:
            port: 5055
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: nfs-artnas
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          seerr:
            seed-config:
              - path: /app/config
            app:
              - path: /app/config
      scripts:
        type: configMap
        name: media-scripts
        advancedMounts:
          seerr:
            seed-config:
              - path: /scripts
                readOnly: true
