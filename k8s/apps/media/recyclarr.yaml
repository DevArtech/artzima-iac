---
# Recyclarr: applies the TRaSH-guide quality definitions, profiles and custom
# formats (config in git: recyclarr/recyclarr.yml -> ConfigMap recyclarr-config)
# to Sonarr and Radarr. Daily; run it once by hand after the first deploy:
#   kubectl -n media create job --from=cronjob/recyclarr recyclarr-first
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  schedule: "17 4 * * *"
  timeZone: ${timezone}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the image's default (rootless) user
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.8.1
              args: ["sync"]
              env:
                - name: TZ
                  value: ${timezone}
                - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR # read-only root fs
                  value: /tmp
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-apikeys
                      key: SONARR_API_KEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-apikeys
                      key: RADARR_API_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: config # cache + the TRaSH guide clone (re-fetched each run)
                  mountPath: /config
                - name: recyclarr-yml
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              emptyDir:
                sizeLimit: 512Mi
            - name: recyclarr-yml
              configMap:
                name: recyclarr-config
            - name: tmp
              emptyDir: {}
