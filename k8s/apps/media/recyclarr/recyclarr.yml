# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Recyclarr v8: TRaSH-guide quality definitions, quality profiles and custom
# formats for Sonarr and Radarr. Run by the CronJob in k8s/apps/media/recyclarr.yaml
# (`recyclarr sync`). API keys come from env (ESO Secret media-apikeys, Infisical
# /k8s/media). Based on recyclarr/config-templates `web-1080p` (Sonarr) and
# `hd-bluray-web` (Radarr). v8 has no `include: template:` any more: the profile
# is referenced by its TRaSH trash_id and the CF groups below are synced.
# Lidarr: NOT supported by Recyclarr (Sonarr and Radarr only, checked 2026-11-23);
# Lidarr keeps its own default profiles plus the "Owned rip" profile from the Job.
# Profile names created: "WEB-1080p" (Sonarr) and "HD Bluray + WEB" (Radarr);
# the media-wiring Job makes them Seerr's defaults.
# Change: edit, commit, push; the next run applies it (or trigger by hand:
#   kubectl -n media create job --from=cronjob/recyclarr recyclarr-manual).

sonarr:
  web-1080p:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
        - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4 # [Optional] Language Profiles
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats

radarr:
  hd-bluray-web:
    base_url: http://radarr.media.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
