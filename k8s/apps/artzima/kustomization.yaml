---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../routes # generated from /apps.yaml: the only public routes
  - ../external
  - ../wizarr
  - ../alexandria
  - ../skyjo
  - ../media
  - ../recs # recommendations (namespace media, cluster-internal only)
  - ../vaultwarden
  - ../paperless
  - ../backups
  - ../monitoring # Grafana: admin login sync + dashboards as code
  - ../nas-alert-relay # LAN-only relay: Backrest/restic-maint on the NAS -> hq-egress -> HQ
