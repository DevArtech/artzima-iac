---
# Spoolman's Postgres: a CloudNativePG Cluster (operator: k8s/infrastructure/
# controllers/cloudnative-pg.yaml). Why not Spoolman's default SQLite: SQLite on the
# NFSv3 NAS stalls on every lock (docs/decisions.md "arr apps on Postgres"), and the
# inventory deserves the CNPG backups. CNPG generates the credentials itself: Secret
# spoolman-db-app (keys username, password, ...); its username/password are
# SPOOLMAN_DB_USERNAME/PASSWORD. Nothing of it is in git or Infisical.
#
# Backups, two layers (restore: docs/backups.md "Postgres"):
#   1. CNPG: nightly ScheduledBackup with method volumeSnapshot (nfs-artnas-snapshot,
#      a tarball of the PGDATA volume on the NAS, deletionPolicy Retain).
#   2. Off-site (B2): WAL archiving + nightly base backups, Barman Cloud plugin
#      (ObjectStore `b2` + ScheduledBackup spoolman-db-b2 below) = point-in-time recovery.
#      Monthly restore self-check + retention: generated (k8s/apps/backups/maintenance.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: spoolman-db
  namespace: spoolman
spec:
  # One instance: NFS is the only shared storage, and a replica on the same NAS
  # would add no durability (docs/decisions.md "Postgres via CNPG on NFS").
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: spoolman
      owner: spoolman # -> Secret spoolman-db-app
  storage:
    storageClass: nfs-artnas # Retain: deleting the Cluster keeps the data on the NAS
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: b2
  backup:
    volumeSnapshot:
      className: nfs-artnas-snapshot
      # Hot snapshot (pg_wal is inside the same volume); a B2 outage must not block it.
      online: true
      onlineConfiguration:
        immediateCheckpoint: true
        waitForArchive: false
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: spoolman-db-nightly
  namespace: spoolman
spec:
  cluster:
    name: spoolman-db
  method: volumeSnapshot
  schedule: "0 35 3 * * *" # 03:35 UTC daily (seconds field first: CNPG cron format)
  immediate: true # one right after creation, so a backup exists from day one
  backupOwnerReference: self
---
# Off-site base backup (B2), nightly; WAL is archived continuously in between.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: spoolman-db-b2
  namespace: spoolman
spec:
  cluster:
    name: spoolman-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "0 10 4 * * *" # 04:10 UTC daily (seconds field first)
  immediate: true
  backupOwnerReference: self
---
# Where this cluster's base backups and WAL go: s3://<pg bucket>/spoolman/spoolman-db/...
# Credentials: Secret b2-pg (ClusterExternalSecret, k8s/secrets/backups/b2-pg.yaml),
# the pg bucket's own scoped key (tofu/backblaze). Retention: backups.yml.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: b2
  namespace: spoolman
spec:
  # No retentionPolicy: the instance sidecar only ADDS (its key cannot delete).
  # Retention: CronJob <cluster>-retention with the maintenance key (k8s/apps/backups/maintenance.yaml).
  configuration:
    destinationPath: s3://${b2_bucket_pg}/spoolman
    endpointURL: https://${b2_s3_endpoint}
    s3Credentials:
      accessKeyId:
        name: b2-pg
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: b2-pg
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    # Keep boto3's default checksums (when_supported): B2 Object Lock requires one on
    # every upload (proven 2026-11-24, see k8s/apps/paperless/database.yaml).
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_supported
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_supported
