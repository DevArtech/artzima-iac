---
# Cloudflare Tunnel token. Written INTO Infisical by OpenTofu
# (tofu/cloudflare: infisical_secret, write-only) on `make cf-apply`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tunnel-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: tunnel-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /k8s/cloudflared/TUNNEL_TOKEN
