---
# Everything the cluster needs from Infisical. These files hold only Infisical
# paths and key names; the values never touch git (docs/secrets.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-secret-store.yaml
  - ghcr-pull.yaml
  - flux-system/cluster-secret-vars.yaml
  - cloudflared/tunnel-token.yaml
  - monitoring/grafana-admin.yaml
  - monitoring/pve-exporter.yaml
  - monitoring/alert-webhook.yaml
  - tailscale/operator-oauth.yaml
  - alexandria/alexandria.yaml
  - media/media.yaml
  - vaultwarden/vaultwarden.yaml
  - paperless/paperless.yaml
  - backups/b2-pg.yaml
  - backups/restic.yaml # generated (make render)
  - backups/maintenance.yaml # maintenance keys (retention), never given to backup jobs
