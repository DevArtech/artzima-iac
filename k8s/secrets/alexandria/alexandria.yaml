---
# Alexandria: MCP bearer, OAuth-proxy login, optional legacy bearer and
# embedder key (docs/manual-steps.md §8). Empty values are allowed in Infisical
# for LEGACY_BEARER_TOKEN / OPENAI_API_KEY and mean "unset" to the apps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alexandria
  namespace: alexandria
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: alexandria
    creationPolicy: Owner
  data:
    - secretKey: ALEXANDRIA_MCP_TOKEN
      remoteRef:
        key: /k8s/alexandria/ALEXANDRIA_MCP_TOKEN
    - secretKey: LOGIN_USERNAME
      remoteRef:
        key: /k8s/alexandria/LOGIN_USERNAME
    - secretKey: LOGIN_PASSWORD
      remoteRef:
        key: /k8s/alexandria/LOGIN_PASSWORD
    - secretKey: LEGACY_BEARER_TOKEN
      remoteRef:
        key: /k8s/alexandria/LEGACY_BEARER_TOKEN
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /k8s/alexandria/OPENAI_API_KEY
