---
# Paperless-ngx: Django secret key + the initial superuser. Database credentials are
# CNPG-generated (paperless-db-app), not here. The API token Headquarters
# (G.A.R.T.H.) uses is created by the operator INSIDE Paperless and stored in HQ's
# own credential store: it is not in Infisical or this repo (docs/manual-steps.md §13).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: paperless
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: /k8s/paperless/SECRET_KEY
    - secretKey: ADMIN_USER
      remoteRef:
        key: /k8s/paperless/ADMIN_USER
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: /k8s/paperless/ADMIN_PASSWORD
