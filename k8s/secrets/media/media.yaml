---
# Media stack (k8s/apps/media). Names only; the values live in Infisical
# (docs/secrets.md, secrets.manifest.yaml). All of them must be filled in before
# the Flux sync: this Kustomization waits until every ExternalSecret is synced
# (the Jellyfin ones are written by `make jellyfin`).
#
# API keys the apps start with (SONARR__AUTH__APIKEY, ... / seeded config files);
# also read by the media-wiring Job and Recyclarr. Generate: openssl rand -hex 16
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-apikeys
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: media-apikeys
    creationPolicy: Owner
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: /k8s/media/SONARR_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: /k8s/media/RADARR_API_KEY
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: /k8s/media/LIDARR_API_KEY
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: /k8s/media/PROWLARR_API_KEY
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: /k8s/media/BAZARR_API_KEY
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: /k8s/media/SEERR_API_KEY
    - secretKey: SABNZBD_API_KEY
      remoteRef:
        key: /k8s/media/SABNZBD_API_KEY
---
# Usenet subscriptions (the operator's): the NZBGeek indexer key (Prowlarr) and the
# UsenetServer news server (SABnzbd). Read only by the media-wiring Job, which puts them
# into Prowlarr and SABnzbd over their APIs (docs/manual-steps.md §10).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usenet
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: usenet
    creationPolicy: Owner
  data:
    - secretKey: NZBGEEK_API_KEY
      remoteRef:
        key: /k8s/media/NZBGEEK_API_KEY
    - secretKey: USENET_HOST
      remoteRef:
        key: /k8s/media/USENET_HOST
    - secretKey: USENET_PORT
      remoteRef:
        key: /k8s/media/USENET_PORT
    - secretKey: USENET_USER
      remoteRef:
        key: /k8s/media/USENET_USER
    - secretKey: USENET_PASSWORD
      remoteRef:
        key: /k8s/media/USENET_PASSWORD
---
# qBittorrent WebUI login (seeded into qBittorrent.conf as a PBKDF2 hash by the
# pod's init container; used by Sonarr/Radarr via the media-wiring Job).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: qbittorrent
    creationPolicy: Owner
  data:
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: /k8s/media/QBITTORRENT_USERNAME
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: /k8s/media/QBITTORRENT_PASSWORD
---
# Jellyfin API key 'artzima-iac' (created in Jellyfin and stored here by `make jellyfin`):
# Sonarr/Radarr "Connect" notifications refresh the library on import.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-api
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: jellyfin-api
    creationPolicy: Owner
  data:
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: /k8s/media/JELLYFIN_API_KEY
---
# Jellyfin admin login: the cluster's copy of /operator/JELLYFIN_ADMIN_USER / _PASSWORD,
# written by `make jellyfin`. The media-wiring Job signs in to Seerr with it once, which
# makes that Jellyfin admin Seerr's admin and connects Seerr to Jellyfin.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-admin
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: jellyfin-admin
    creationPolicy: Owner
  data:
    - secretKey: JELLYFIN_ADMIN_USER
      remoteRef:
        key: /k8s/media/JELLYFIN_ADMIN_USER
    - secretKey: JELLYFIN_ADMIN_PASSWORD
      remoteRef:
        key: /k8s/media/JELLYFIN_ADMIN_PASSWORD
---
# Surfshark WireGuard (gluetun sidecar in the qbittorrent pod). From the
# Surfshark account: Manual setup -> WireGuard (docs/manual-steps.md §10).
# SERVER_COUNTRIES is not secret: ansible/group_vars/all/media.yml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surfshark
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: surfshark
    creationPolicy: Owner
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: /k8s/vpn/WIREGUARD_PRIVATE_KEY
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: /k8s/vpn/WIREGUARD_ADDRESSES
