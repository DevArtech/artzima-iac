---
# The recs service (k8s/apps/recs): read-only use of the media APIs it learns from, and the
# local LLM's API key. Its own Secret, only the five keys it needs (not all of media-apikeys).
# Values: Infisical /k8s/media (generated by `make gen-secrets`; JELLYFIN_API_KEY by `make jellyfin`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recs
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: recs
    creationPolicy: Owner
  data:
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: /k8s/media/JELLYFIN_API_KEY
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: /k8s/media/SEERR_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: /k8s/media/RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: /k8s/media/SONARR_API_KEY
    - secretKey: LLM_API_KEY
      remoteRef:
        key: /k8s/media/LLM_API_KEY
