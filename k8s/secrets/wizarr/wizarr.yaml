---
# Wizarr's setup Job (k8s/apps/wizarr/setup.yaml): the Jellyfin admin login becomes
# Wizarr's admin, and the Jellyfin API key 'artzima-iac' connects Wizarr to Jellyfin.
# Same Infisical keys as media/jellyfin-admin and media/jellyfin-api (written by
# `make jellyfin`); a Secret can't be read across namespaces, so this is a second copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wizarr-setup
  namespace: wizarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: wizarr-setup
    creationPolicy: Owner
  data:
    - secretKey: JELLYFIN_ADMIN_USER
      remoteRef:
        key: /k8s/media/JELLYFIN_ADMIN_USER
    - secretKey: JELLYFIN_ADMIN_PASSWORD
      remoteRef:
        key: /k8s/media/JELLYFIN_ADMIN_PASSWORD
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: /k8s/media/JELLYFIN_API_KEY
