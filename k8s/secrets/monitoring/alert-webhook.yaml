---
# THE alert endpoint (Infisical /k8s/alerts/WEBHOOK_URL, one URL for everything):
#   monitoring/alert-webhook  key `url`: Alertmanager webhook_configs url_file. Every
#   alert goes there, Flux health included (kube-state-metrics gotk_resource_info).
# Backrest on the NAS posts the same path via k8s/apps/nas-alert-relay (role nas_backup). EMPTY = not wired yet:
# alerts still show in Alertmanager/Grafana and `make verify`, but are not sent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: alert-webhook
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: /k8s/alerts/WEBHOOK_URL
