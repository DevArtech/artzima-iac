---
# Grafana admin login (kube-prometheus-stack: admin.existingSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: /k8s/monitoring/GRAFANA_ADMIN_USER
    - secretKey: admin-password
      remoteRef:
        key: /k8s/monitoring/GRAFANA_ADMIN_PASSWORD
