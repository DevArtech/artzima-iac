---
# prometheus-pve-exporter config. The read-only prometheus@pve!exporter token
# value is written INTO Infisical by the Ansible proxmox_api role
# (`make proxmox-api`); user and token name are not secret and live here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: pve-exporter
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        pve.yml: |
          default:
            user: prometheus@pve
            token_name: exporter
            token_value: "{{ .token }}"
            verify_ssl: false
  data:
    - secretKey: token
      remoteRef:
        key: /k8s/monitoring/PVE_EXPORTER_TOKEN
