---
# MAINTENANCE keys (tofu/backblaze "<bucket>-maint": no deleteFiles either, but the
# only keys used for forget/prune/retention). The backup jobs never see them.
# restic (VolSync repositories): CronJobs backup/restic-maintenance + restic-restore-test.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-maint
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: restic-maint
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_PASSWORD: '{{ .password }}'
        AWS_ACCESS_KEY_ID: '{{ .keyId }}'
        AWS_SECRET_ACCESS_KEY: '{{ .key }}'
        AWS_DEFAULT_REGION: ${b2_region}
  data:
    - secretKey: password
      remoteRef:
        key: /k8s/backup/RESTIC_PASSWORD
    - secretKey: keyId
      remoteRef:
        key: /k8s/backup/RESTIC_B2_MAINT_KEY_ID
    - secretKey: key
      remoteRef:
        key: /k8s/backup/RESTIC_B2_MAINT_APPLICATION_KEY
---
# Postgres (barman-cloud): Secret b2-pg-maint in every CNPG namespace, read only by the
# <cluster>-retention CronJobs (barman-cloud-backup-delete).
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: b2-pg-maint
spec:
  namespaceSelectors:
    - matchLabels:
        artzima.io/cnpg-offsite: "true"
  refreshTime: 1h
  externalSecretName: b2-pg-maint
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: b2-pg-maint
      creationPolicy: Owner
    data:
      - secretKey: ACCESS_KEY_ID
        remoteRef:
          key: /k8s/backup/PG_B2_MAINT_KEY_ID
      - secretKey: ACCESS_SECRET_KEY
        remoteRef:
          key: /k8s/backup/PG_B2_MAINT_APPLICATION_KEY
