---
# B2 key of the Postgres bucket (written into Infisical by tofu/backblaze), as
# Secret `b2-pg` in EVERY namespace labelled artzima.io/cnpg-offsite=true (today:
# vaultwarden, paperless, media, spoolman). Each CNPG cluster's ObjectStore reads it. New CNPG
# cluster = label its namespace + an ObjectStore (docs/backups.md "Postgres").
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: b2-pg
spec:
  namespaceSelectors:
    - matchLabels:
        artzima.io/cnpg-offsite: "true"
  refreshTime: 1h
  externalSecretName: b2-pg
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: b2-pg
      creationPolicy: Owner
    data:
      - secretKey: ACCESS_KEY_ID
        remoteRef:
          key: /k8s/backup/PG_B2_KEY_ID
      - secretKey: ACCESS_SECRET_KEY
        remoteRef:
          key: /k8s/backup/PG_B2_APPLICATION_KEY
