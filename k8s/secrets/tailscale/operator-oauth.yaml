---
# Tailscale operator OAuth client (scopes: Devices Core, Auth Keys, Services
# write; tag tag:k8s-operator). The chart uses this pre-existing Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: /k8s/tailscale/OPERATOR_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: /k8s/tailscale/OPERATOR_CLIENT_SECRET
