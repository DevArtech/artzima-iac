---
# Vaultwarden app secret: ADMIN_TOKEN (an Argon2id PHC hash, never the plaintext)
# plus OPTIONAL SMTP. The SMTP_* keys must exist in Infisical but may be EMPTY;
# the template emits only the non-empty ones, so without SMTP the pod simply has
# no SMTP_* env (Vaultwarden then shows invite links in the admin page instead).
# The database credentials are NOT here: CNPG generates them (vaultwarden-db-app).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: vaultwarden
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |
            ADMIN_TOKEN: {{ .ADMIN_TOKEN | toJson }}
            {{- range $k := list "SMTP_HOST" "SMTP_FROM" "SMTP_USERNAME" "SMTP_PASSWORD" }}
            {{- with index $ $k }}
            {{ $k }}: {{ . | toJson }}
            {{- end }}
            {{- end }}
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: /k8s/vaultwarden/ADMIN_TOKEN
    - secretKey: SMTP_HOST
      remoteRef:
        key: /k8s/vaultwarden/SMTP_HOST
    - secretKey: SMTP_FROM
      remoteRef:
        key: /k8s/vaultwarden/SMTP_FROM
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: /k8s/vaultwarden/SMTP_USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: /k8s/vaultwarden/SMTP_PASSWORD
---
# Passphrase of the nightly encrypted NAS backup (k8s/apps/vaultwarden/backup.yaml).
# Losing it = the NAS backups can't be decrypted: keep a copy in your password manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: vaultwarden-backup
    creationPolicy: Owner
  data:
    - secretKey: BACKUP_PASSPHRASE
      remoteRef:
        key: /k8s/vaultwarden/BACKUP_PASSPHRASE
