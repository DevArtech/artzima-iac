---
# Private, non-secret values that must not be in the public repo, for Flux
# postBuild substitution of the `apps` Kustomization (k8s/clusters/artzima/apps.yaml):
#   ${public_domain}  <- Infisical /k8s/settings/PUBLIC_DOMAIN, the cluster project's copy of
#                        /settings/PUBLIC_DOMAIN (make secrets-migrate-k8s)  (routes, Alexandria RESOURCE_URL)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secret-vars
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cluster-secret-vars
    creationPolicy: Owner
  data:
    - secretKey: public_domain
      remoteRef:
        key: /k8s/settings/PUBLIC_DOMAIN
