---
# Private, non-secret values that must not be in the public repo, for Flux
# postBuild substitution of the `apps` Kustomization (k8s/clusters/artzima/apps.yaml):
#   ${public_domain}  <- Infisical /settings/PUBLIC_DOMAIN  (routes, Alexandria RESOURCE_URL)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secret-vars
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cluster-secret-vars
    creationPolicy: Owner
  data:
    - secretKey: public_domain
      remoteRef:
        key: /settings/PUBLIC_DOMAIN
