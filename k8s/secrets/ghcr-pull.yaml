---
# Private GHCR pull secret `ghcr-pull` (type dockerconfigjson) in EVERY
# namespace labelled artzima.io/ghcr-pull=true (today: alexandria, skyjo;
# k8s/infrastructure/namespaces). Built by an ESO template from a classic PAT
# with read:packages only (docs/secrets.md). Adding a namespace that pulls
# ghcr.io/devartech/* = add the label.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: ghcr-pull
spec:
  namespaceSelectors:
    - matchLabels:
        artzima.io/ghcr-pull: "true"
  refreshTime: 1h
  externalSecretName: ghcr-pull
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: ghcr-pull
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        engineVersion: v2
        data:
          .dockerconfigjson: >-
            {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
    data:
      - secretKey: username
        remoteRef:
          key: /k8s/ghcr/GHCR_USERNAME
      - secretKey: token
        remoteRef:
          key: /k8s/ghcr/GHCR_PULL_TOKEN
