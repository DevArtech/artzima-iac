---
# The ONE place the cluster reads secrets from: Infisical, via ESO's Infisical
# provider with a universal-auth machine identity ("artzima-eso", read-only).
# Host, project and environment come from ansible/group_vars/all/infisical.yml
# (-> cluster-vars, `make render`). The credentials Secret is created once,
# imperatively, by `make eso-bootstrap`; it is never in git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: ${infisical_host}
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: ${infisical_project_slug}
        environmentSlug: ${infisical_env}
        # Default folder for bare keys; every ExternalSecret here uses absolute
        # keys (/k8s/<area>/<NAME>) anyway, so the paths are explicit.
        secretsPath: /k8s
        # Values are used verbatim (a literal "${...}" in a token stays as is).
        expandSecretReferences: false
