---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 30m
  retryInterval: 2m
  path: ./k8s/apps/artzima
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      # public_domain (and other private, non-secret values) from Infisical
      # /settings, synced by ESO: k8s/secrets/flux-system/cluster-secret-vars.yaml
      - kind: Secret
        name: cluster-secret-vars
