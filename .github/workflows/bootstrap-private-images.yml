name: Bootstrap private image packages

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-private-images.yml]

permissions: {}

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create empty packages and require private visibility
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          trap 'rm -rf "$context"' EXIT
          # No application source, model weights or credentials enter these images.
          printf 'FROM scratch\nLABEL io.artzima.purpose="private-registry-bootstrap"\n' > "$context/Dockerfile"
          for name in alexandria-mcp alexandria-oauth-proxy alexandria-cli skyjo; do
            endpoint="/users/DevArtech/packages/container/$name"
            status="$(curl -sS -o "$context/existing.json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com$endpoint")"
            if [ "$status" = 200 ]; then
              jq -e '.visibility == "private"' "$context/existing.json" >/dev/null || {
                echo "::error::Existing package is not private; refusing to modify it"
                exit 1
              }
              echo "Existing private package verified: $name"
              continue
            fi
            [ "$status" = 404 ] || { echo "::error::Package lookup failed: HTTP $status"; exit 1; }
            docker buildx build --platform linux/amd64 --provenance=false \
              --tag "ghcr.io/devartech/$name:private-bootstrap" --push "$context"
            metadata="$(gh api "$endpoint")"
            if ! jq -e '.visibility == "private"' <<< "$metadata" >/dev/null; then
              # Only the empty package just created in this step is removed.
              gh api --method DELETE "$endpoint"
              echo "::error::The registry did not create a private package. Empty bootstrap removed; application publication remains disabled."
              exit 1
            fi
            echo "Created and verified private empty package: $name"
          done
