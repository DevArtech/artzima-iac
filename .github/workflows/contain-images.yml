name: Contain public image packages

on:
  push:
    branches: [main]
    paths: [.github/workflows/contain-images.yml]

permissions: {}

jobs:
  contain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove only the four verified packages from the initial build
        shell: bash
        run: |
          set -euo pipefail
          for item in alexandria-mcp:17210397 alexandria-oauth-proxy:17210320 alexandria-cli:17210323 skyjo:17210347; do
            name="${item%:*}"
            expected="${item#*:}"
            endpoint="/users/DevArtech/packages/container/$name"
            metadata="$(gh api "$endpoint")"
            if ! jq -e --argjson id "$expected" '
              .id == $id and .visibility == "public" and .version_count == 3 and
              .repository.full_name == "DevArtech/artzima-iac" and
              .created_at >= "2026-11-23T23:10:00Z" and
              .created_at <= "2026-11-23T23:16:00Z"
            ' <<< "$metadata" >/dev/null; then
              echo "::error::Package identity or state changed; refusing deletion of $name"
              exit 1
            fi
            gh api --method DELETE "$endpoint"
            echo "Removed the verified initial-build package: $name"
          done
