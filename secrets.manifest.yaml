---
# Every Infisical folder and key this repo uses: NAMES ONLY, never values.
# Human-readable version with explanations: docs/secrets.md. What YOU do: docs/OPERATOR-SETUP.md.
#
# Used by:
#   make secrets-check   which keys are missing in Infisical (names only)
#   make secrets-folders create the folders below (no values)
#   make gen-secrets     create every MISSING `by: generated` key, straight into Infisical
#                        (scripts/gen_secrets.py; never printed, never overwrites)
#   make preflight       refuses to continue while a `by: operator` key is missing
#   make lint            (offline) manifest == what the code references
#
# by:  operator    YOU provide it: only the FIVE ROOT CREDENTIALS (+ the Infisical
#                  bootstrap identity, which lives in ~/.config/artzima, not here),
#                  a few private-but-not-secret settings, and the Surfshark subscription.
#      generated   `make gen-secrets` creates it from `generate:` (G.A.R.T.H. may run it)
#                    hex:N        N random bytes as hex          base64:N  N random bytes, base64
#                    literal:X    the fixed default X            empty     an empty value
#                    argon2id-of:/F/KEY   Argon2id PHC hash of another (generated) key
#                    bcrypt-b64-of:/F/KEY base64(bcrypt) of another (generated) key
#      automation  a make target writes it (OpenTofu / Ansible), after: says which
# optional: true   absent is fine          empty_ok: true   must exist, may be empty
# human: true      a generated login for a PERSON (read it in the Infisical UI, keep it in
#                  your password manager); nothing in the lab reads it
# mirror_of: /F/K  a copy of a key that lives in the OTHER project (the cluster can't read the
#                  main project). `make secrets-migrate-k8s` writes it; secrets-check fails if it
#                  differs from its source (compared by hash in memory, never printed).

# Which Infisical project holds which folders (docs/secrets.md, scripts/infisical_projects.py).
# Two projects because Infisical's free plan has no custom roles: ESO gets the BUILT-IN Viewer
# role on the k8s project only, so that project must hold nothing but what the cluster reads.
projects:
  main: [/settings, /bare-metal, /ansible, /tofu, /operator] # everything not under a k8s prefix
  k8s: [/k8s]

folders:
  - /settings
  - /bare-metal
  - /ansible
  - /tofu
  - /operator
  - /k8s
  - /k8s/cloudflared
  - /k8s/monitoring
  - /k8s/alerts
  - /k8s/tailscale
  - /k8s/ghcr
  - /k8s/alexandria
  - /k8s/media
  - /k8s/vpn
  - /k8s/vaultwarden
  - /k8s/paperless
  - /k8s/backup
  - /k8s/settings

secrets:
  # ---------------------------------------------------------------- private settings
  /settings:
    PRIVATE_SITE_CONFIG: { by: automation, after: make private-backup }
    PUBLIC_DOMAIN: { by: operator }
    ADMIN_EMAIL: { by: operator }
    ADMIN_SSH_KEYS: { by: operator }
    CLOUDFLARE_ACCOUNT_ID: { by: operator }
    CLOUDFLARE_ZONE_ID: { by: operator }
    CLOUDFLARE_ACCESS_APPS: { by: operator, optional: true }
  /bare-metal:
    ROOT_PASSWORD_HASHED: { by: operator, optional: true }

  # ---------------------------------------------------------------- hosts (Ansible)
  /ansible:
    NUT_UPSMON_PRIMARY_PASSWORD: { by: generated, generate: "hex:24" }
    NUT_UPSMON_SECONDARY_PASSWORD: { by: generated, generate: "hex:24" }
    PBS_PVE_USER_PASSWORD: { by: generated, generate: "hex:32" }
    # Tailscale auth keys: minted by OpenTofu from the Tailscale OAuth client (root
    # credential #3), tofu/bootstrap. 90-day keys, re-created when expired.
    TAILSCALE_AUTHKEY: { by: automation, after: make bootstrap }
    TAILSCALE_ROUTER_AUTHKEY: { by: automation, after: make bootstrap }
    PBS_FINGERPRINT: { by: automation, after: make up (pbs) }
    PBS_B2_KEY_ID: { by: automation, after: make bootstrap }
    PBS_B2_APPLICATION_KEY: { by: automation, after: make bootstrap }
    # NAS media + personal files: Backrest (restic) on the NAS (role nas_backup).
    NAS_B2_KEY_ID: { by: automation, after: make bootstrap }
    NAS_B2_APPLICATION_KEY: { by: automation, after: make bootstrap }
    NAS_B2_MAINT_KEY_ID: { by: automation, after: make bootstrap }
    NAS_B2_MAINT_APPLICATION_KEY: { by: automation, after: make bootstrap }
    NAS_RESTIC_PASSWORD: { by: generated, generate: "base64:48" }
    NAS_BACKREST_USER: { by: generated, generate: "literal:admin" }
    NAS_BACKREST_PASSWORD_BCRYPT: { by: generated, generate: "bcrypt-b64-of:/operator/BACKREST_PASSWORD" }
    NAS_BACKUP_HEALTHCHECKS_URL: { by: generated, generate: "empty", empty_ok: true }
    NAS_SUDO_PASSWORD: { by: operator } # the NAS (UGOS) user devartech: login = sudo password; make nas-backup

  # ---------------------------------------------------------------- OpenTofu
  /tofu:
    TOFU_STATE_PASSPHRASE: { by: generated, generate: "base64:32" }
    # ROOT CREDENTIAL #2: Cloudflare API token (Tunnel Edit, Access Edit, DNS Edit).
    CLOUDFLARE_API_TOKEN: { by: operator }
    # ROOT CREDENTIAL #4: a B2 key that may create buckets and keys.
    B2_ADMIN_KEY_ID: { by: operator }
    B2_ADMIN_APPLICATION_KEY: { by: operator }
    PROXMOX_API_TOKEN: { by: automation, after: make up (proxmox-api) }
    # The read-only ESO machine identity, created by OpenTofu (tofu/bootstrap).
    ESO_CLIENT_ID: { by: automation, after: make bootstrap }
    ESO_CLIENT_SECRET: { by: automation, after: make bootstrap }

  # ---------------------------------------------------------------- logins for people
  /operator:
    VAULTWARDEN_ADMIN_PASSWORD: { by: generated, generate: "base64:24", human: true }
    BACKREST_PASSWORD: { by: generated, generate: "base64:24", human: true }
    PVE_ROOT_PASSWORD: { by: operator, optional: true } # root@pam on the PVE hosts and PBS (web UI and console)
    # Jellyfin's admin: `make jellyfin` runs the first-run wizard with it (role jellyfin_setup).
    JELLYFIN_ADMIN_USER: { by: generated, generate: "literal:devartech" }
    JELLYFIN_ADMIN_PASSWORD: { by: generated, generate: "base64:24", human: true }

  # ---------------------------------------------------------------- Kubernetes
  /k8s/cloudflared:
    TUNNEL_TOKEN: { by: automation, after: make bootstrap (cf-apply) }
  /k8s/monitoring:
    # The operator's own Grafana admin login. Grafana reads these only when it first creates
    # its database, so a change must also be applied in Grafana: the grafana-admin-sync Job
    # (k8s/apps/monitoring) does that on the next `apps` sync; docs/manual-steps.md §15.
    GRAFANA_ADMIN_USER: { by: operator }
    GRAFANA_ADMIN_PASSWORD: { by: operator }
    PVE_EXPORTER_TOKEN: { by: automation, after: make up (proxmox-api) }
  # ONE alert endpoint for everything (Alertmanager, Flux, Backrest): an https URL that
  # Headquarters provides later. Empty = alerts go nowhere yet (docs/backups.md "Alerts").
  /k8s/alerts:
    WEBHOOK_URL: { by: generated, generate: "empty", empty_ok: true }
  /k8s/tailscale:
    # ROOT CREDENTIAL #3: Tailscale OAuth client (Devices Core, Auth Keys, Services write;
    # tags tag:k8s-operator, tag:artzima, tag:subnet-router). Also mints the host keys.
    OPERATOR_CLIENT_ID: { by: operator }
    OPERATOR_CLIENT_SECRET: { by: operator }
  /k8s/ghcr:
    GHCR_USERNAME: { by: generated, generate: "literal:devartech" }
    # ROOT CREDENTIAL #5: GitHub classic PAT (read:packages + public_repo): pulls the
    # private images AND bootstraps Flux (make flux-bootstrap reads it from here).
    GHCR_PULL_TOKEN: { by: operator }
  /k8s/alexandria:
    ALEXANDRIA_MCP_TOKEN: { by: generated, generate: "hex:32" }
    LOGIN_USERNAME: { by: generated, generate: "literal:admin" }
    LOGIN_PASSWORD: { by: generated, generate: "hex:16" }
    LEGACY_BEARER_TOKEN: { by: generated, generate: "empty", empty_ok: true }
    OPENAI_API_KEY: { by: generated, generate: "empty", empty_ok: true }
  /k8s/media:
    SONARR_API_KEY: { by: generated, generate: "hex:16" }
    RADARR_API_KEY: { by: generated, generate: "hex:16" }
    LIDARR_API_KEY: { by: generated, generate: "hex:16" }
    PROWLARR_API_KEY: { by: generated, generate: "hex:16" }
    BAZARR_API_KEY: { by: generated, generate: "hex:16" }
    SEERR_API_KEY: { by: generated, generate: "hex:32" }
    SABNZBD_API_KEY: { by: generated, generate: "hex:16" }
    # llama-server's API key (role llm_server, `make llm`; the LLM LXC on host01) and the
    # recs service's copy of it (ESO, k8s/secrets/media/recs.yaml).
    LLM_API_KEY: { by: generated, generate: "hex:32" }
    # Usenet subscription data (not generated): the NZBGeek indexer API key (nzbgeek.info ->
    # My Account) and the UsenetServer news server login (docs/manual-steps.md §10.1).
    NZBGEEK_API_KEY: { by: operator }
    USENET_HOST: { by: operator }
    USENET_PORT: { by: operator }
    USENET_USER: { by: operator }
    USENET_PASSWORD: { by: operator }
    QBITTORRENT_USERNAME: { by: generated, generate: "literal:admin" }
    QBITTORRENT_PASSWORD: { by: generated, generate: "base64:24" }
    # Jellyfin API key 'artzima-iac', created in Jellyfin and written here by `make jellyfin`
    # (role jellyfin_setup); the wiring Job's Jellyfin "Connect" step uses it, and Wizarr's
    # setup Job connects Wizarr to Jellyfin with it (copy: wizarr/wizarr-setup).
    JELLYFIN_API_KEY: { by: automation, after: make jellyfin }
    # The cluster's copies of the Jellyfin admin login (/operator): the wiring Job's Seerr
    # setup signs in with it once, and Wizarr's setup Job makes it Wizarr's admin. `make jellyfin` rewrites them on every run, so a changed
    # /operator password reaches the cluster with the next `make jellyfin`.
    JELLYFIN_ADMIN_USER: { by: automation, after: make jellyfin, mirror_of: /operator/JELLYFIN_ADMIN_USER }
    JELLYFIN_ADMIN_PASSWORD: { by: automation, after: make jellyfin, mirror_of: /operator/JELLYFIN_ADMIN_PASSWORD }
  /k8s/vpn:
    # Third-party subscription data (Surfshark Manual setup > WireGuard), not generated.
    WIREGUARD_PRIVATE_KEY: { by: operator }
    WIREGUARD_ADDRESSES: { by: operator }
  /k8s/vaultwarden:
    ADMIN_TOKEN: { by: generated, generate: "argon2id-of:/operator/VAULTWARDEN_ADMIN_PASSWORD" }
    BACKUP_PASSPHRASE: { by: generated, generate: "base64:32" }
    SMTP_HOST: { by: generated, generate: "empty", empty_ok: true }
    SMTP_FROM: { by: generated, generate: "empty", empty_ok: true }
    SMTP_USERNAME: { by: generated, generate: "empty", empty_ok: true }
    SMTP_PASSWORD: { by: generated, generate: "empty", empty_ok: true }
  /k8s/paperless:
    SECRET_KEY: { by: generated, generate: "base64:48" }
    ADMIN_USER: { by: operator } # his own Paperless admin username (2026-11-24: devartech)
    ADMIN_PASSWORD: { by: operator } # his own; Paperless reads it only when first creating the admin, so a change must also be applied in Paperless
  # The public domain for Flux substitutions (${public_domain}): the cluster's copy of
  # /settings/PUBLIC_DOMAIN (main project), kept equal by `make secrets-migrate-k8s`.
  /k8s/settings:
    PUBLIC_DOMAIN: { by: automation, after: make secrets-migrate-k8s, mirror_of: /settings/PUBLIC_DOMAIN }
    # Headquarters' tailnet name (the alert egress, k8s/apps/monitoring/hq-egress.yaml), set by HQ's
    # G.A.R.T.H. with the alert URL; after a Headquarters move, update both (docs/backups.md "Alerts").
    HQ_TAILNET_FQDN: { by: operator }
  # Off-site backups (docs/backups.md): per bucket a BACKUP key and a separate
  # MAINTENANCE key (forget/prune/retention), neither with deleteFiles.
  /k8s/backup:
    PG_B2_KEY_ID: { by: automation, after: make bootstrap }
    PG_B2_APPLICATION_KEY: { by: automation, after: make bootstrap }
    PG_B2_MAINT_KEY_ID: { by: automation, after: make bootstrap }
    PG_B2_MAINT_APPLICATION_KEY: { by: automation, after: make bootstrap }
    RESTIC_B2_KEY_ID: { by: automation, after: make bootstrap }
    RESTIC_B2_APPLICATION_KEY: { by: automation, after: make bootstrap }
    RESTIC_B2_MAINT_KEY_ID: { by: automation, after: make bootstrap }
    RESTIC_B2_MAINT_APPLICATION_KEY: { by: automation, after: make bootstrap }
    RESTIC_PASSWORD: { by: generated, generate: "base64:48" }
