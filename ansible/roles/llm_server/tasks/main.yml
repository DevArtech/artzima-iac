---
# llama.cpp's server with a pinned GGUF, as a hardened systemd service in the `llm` LXC.
# Idempotent: downloads are skipped while the files match their pinned sha256.
- name: Shared libraries of the prebuilt binaries
  ansible.builtin.apt:
    name: "{{ llm_server_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Service user
  ansible.builtin.user:
    name: "{{ llm_server_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/llama
    create_home: false

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ llm_server_install_dir }}", group: root, mode: "0755" }
    - { path: "{{ llm_server_install_dir }}/{{ llm_server_llamacpp_build }}", group: root, mode: "0755" }
    - { path: /var/lib/llama, group: root, mode: "0755" }
    - { path: "{{ llm_server_model_dir }}", group: root, mode: "0755" }
    - { path: "{{ llm_server_config_dir }}", group: "{{ llm_server_user }}", mode: "0750" }

# ---------------------------------------------------------------- llama.cpp
- name: Download llama.cpp (sha256-pinned) {{ llm_server_llamacpp_build }}
  ansible.builtin.get_url:
    url: "{{ llm_server_llamacpp_url }}"
    dest: "{{ llm_server_install_dir }}/llama-{{ llm_server_llamacpp_build }}-bin-ubuntu-x64.tar.gz"
    checksum: "sha256:{{ llm_server_llamacpp_sha256 }}"
    mode: "0644"

- name: Unpack llama.cpp {{ llm_server_llamacpp_build }}
  ansible.builtin.unarchive:
    src: "{{ llm_server_install_dir }}/llama-{{ llm_server_llamacpp_build }}-bin-ubuntu-x64.tar.gz"
    dest: "{{ llm_server_install_dir }}/{{ llm_server_llamacpp_build }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ llm_server_install_dir }}/{{ llm_server_llamacpp_build }}/llama-server"
    owner: root
    group: root
  notify: Restart llama-server

- name: Point "current" at {{ llm_server_llamacpp_build }}
  ansible.builtin.file:
    src: "{{ llm_server_install_dir }}/{{ llm_server_llamacpp_build }}"
    dest: "{{ llm_server_install_dir }}/current"
    state: link
  notify: Restart llama-server

# ---------------------------------------------------------------- the model
- name: Download the model (sha256-pinned, ~2.5 GB) {{ llm_server_model_file }}
  ansible.builtin.get_url:
    url: "{{ llm_server_model_url }}"
    dest: "{{ llm_server_model_dir }}/{{ llm_server_model_file }}"
    checksum: "sha256:{{ llm_server_model_sha256 }}"
    mode: "0644"
    timeout: 120
  notify: Restart llama-server

# ---------------------------------------------------------------- service
- name: API key file (Infisical /k8s/media/LLM_API_KEY)
  ansible.builtin.copy:
    dest: "{{ llm_server_config_dir }}/api-keys"
    content: "{{ llm_server_api_key }}\n"
    owner: root
    group: "{{ llm_server_user }}"
    mode: "0640"
  no_log: true
  notify: Restart llama-server

- name: Systemd unit
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    mode: "0644"
  notify: Restart llama-server

- name: Enable and start llama-server
  ansible.builtin.systemd_service:
    name: llama-server
    enabled: true
    state: started
    daemon_reload: true

- name: Apply a pending restart now (before the checks)
  ansible.builtin.meta: flush_handlers

# ---------------------------------------------------------------- checks
- name: Wait for the server (model loaded)
  ansible.builtin.uri:
    url: "http://{{ llm_server_host }}:{{ llm_server_port }}/health"
  register: llm_server_health
  until: llm_server_health.status == 200
  retries: 60
  delay: 5

- name: Check a JSON-schema-constrained answer
  ansible.builtin.uri:
    url: "http://{{ llm_server_host }}:{{ llm_server_port }}/v1/chat/completions"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_server_api_key }}"
    body_format: json
    body:
      model: "{{ llm_server_model_alias }}"
      temperature: 0
      max_tokens: 64
      messages:
        - { role: user, content: "Rate the film Arrival (2016) for a fan of thoughtful science fiction, 0-10." }
      response_format:
        type: json_schema
        json_schema:
          name: rating
          strict: true
          schema:
            type: object
            properties:
              score: { type: integer, minimum: 0, maximum: 10 }
            required: [score]
            additionalProperties: false
    timeout: 300
  register: llm_server_smoke
  no_log: true

- name: Show the check's answer
  ansible.builtin.debug:
    msg: "llama-server answered {{ llm_server_smoke.json.choices[0].message.content }} ({{ llm_server_smoke.json.usage | default({}) }})"
  failed_when: (llm_server_smoke.json.choices[0].message.content | from_json).score is not number
