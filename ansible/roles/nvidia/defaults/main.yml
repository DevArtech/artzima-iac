---
# Debian 13 packages (non-free). The Jellyfin LXC installs the SAME Debian
# userspace packages, which keeps driver and libraries in lockstep.
nvidia_packages:
  - proxmox-default-headers
  - nvidia-kernel-dkms
  - nvidia-driver
  - nvidia-smi
  - nvidia-persistenced
  - nvidia-modprobe
  - firmware-misc-nonfree
