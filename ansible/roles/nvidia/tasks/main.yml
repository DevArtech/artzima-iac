---
- name: Enable contrib/non-free components in debian.sources
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/debian.sources
    regexp: '^Components: .*$'
    replace: 'Components: main contrib non-free non-free-firmware'
  register: nvidia_sources

- name: Blacklist nouveau
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      blacklist nouveau
      options nouveau modeset=0
  notify: Rebuild initramfs

- name: Load nvidia modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nvidia.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      nvidia
      nvidia_uvm

- name: Create /dev/nvidia-uvm* and caps nodes at boot (needed by the LXC)
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-nvidia.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      KERNEL=="nvidia", RUN+="/bin/bash -c '/usr/bin/nvidia-smi -L && /usr/bin/nvidia-modprobe -c0 -u'"
      KERNEL=="nvidia_uvm", RUN+="/bin/bash -c '/usr/bin/nvidia-modprobe -c0 -u'"

- name: NVIDIA apt repository (cuda-keyring)
  ansible.builtin.apt:
    deb: "{{ nvidia_repo_url }}/cuda-keyring_1.1-1_all.deb"
  register: nvidia_keyring

- name: Pin the NVIDIA driver packages to nvidia_driver_version
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nvidia-driver
    owner: root
    group: root
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      Package: nvidia-* libnvidia-* libxnvctrl0 libcuda1 libnvcuvid1 libnvoptix1 xserver-xorg-video-nvidia firmware-nvidia-*
      Pin: version {{ nvidia_driver_version }}-*
      Pin-Priority: 1001
  register: nvidia_pin

- name: Install the NVIDIA driver
  ansible.builtin.apt:
    name: "{{ nvidia_packages }}"
    state: present
    # The pin is the authority: return a package a dist-upgrade moved past it (libxnvctrl0
    # went to a newer release before it was pinned and took nvidia-open/nvidia-settings out).
    allow_downgrade: true
    update_cache: "{{ nvidia_sources is changed or nvidia_keyring is changed or nvidia_pin is changed }}"
  notify: Reboot reminder
