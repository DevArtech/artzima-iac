---
# Jellyfin's own configuration over its HTTP API on the LXC itself (role tasks/main.yml).
jellyfin_setup_url: "http://localhost:{{ http_port | default(8096) }}"
# Identifies this client to Jellyfin (its sessions and devices list).
jellyfin_setup_client_header: >-
  MediaBrowser Client="artzima-iac", Device="ansible", DeviceId="artzima-iac-ansible", Version="1.0"
# Hide request/response data of the authenticated calls (session token, password, API key).
# Set false only to debug a failing API call, and never in a shared log.
jellyfin_setup_no_log: true

# First-run wizard (only while Jellyfin reports it is not done).
jellyfin_setup_startup:
  UICulture: en-US
  MetadataCountryCode: US
  PreferredMetadataLanguage: en

# Libraries: created when no library of that name exists; never changed or deleted, and
# created WITHOUT a scan (refreshLibrary=false). /data/media is the LXC's read-only bind mount.
jellyfin_setup_libraries:
  - { name: Movies, type: movies, path: /data/media/movies }
  - { name: Shows, type: tvshows, path: /data/media/tv }
  - { name: Music, type: music, path: /data/media/music }

# Dashboard > Playback > Transcoding. RTX 3050 Ti (Ampere GA107): NVDEC decodes
# H.264, HEVC (8/10-bit), VC-1, VP9 (8/10-bit) and AV1; NVENC encodes H.264 and HEVC
# (AV1 encode needs Ada). Tone mapping runs as a CUDA filter on NVIDIA.
jellyfin_setup_encoding:
  HardwareAccelerationType: nvenc
  HardwareDecodingCodecs: [h264, hevc, vc1, vp9, av1]
  EnableHardwareEncoding: true
  AllowHevcEncoding: true
  AllowAv1Encoding: false
  EnableDecodingColorDepth10Hevc: true
  EnableDecodingColorDepth10Vp9: true
  EnableEnhancedNvdecDecoder: true
  EnableTonemapping: true
  # Transcodes on the NAS (tasks/transcodes.yml), and cleared while playing: segments
  # older than SegmentKeepSeconds are deleted, and ffmpeg pauses once it is
  # ThrottleDelaySeconds ahead of the player instead of transcoding the whole file.
  TranscodingTempPath: "{{ jellyfin_setup_transcode_dir }}"
  EnableSegmentDeletion: true
  SegmentKeepSeconds: 720
  EnableThrottling: true
  ThrottleDelaySeconds: 180

# Transcode scratch space: the LXC's read-write bind mount of the NAS folder
# <artnas_export>/<media_data_subdir>/transcodes (lxc_mounts in hosts.yml,
# group_vars/all/lxc_storage.yml), and Jellyfin's own sub-folder in it.
jellyfin_setup_transcode_mount: /data/transcodes
jellyfin_setup_transcode_dir: /data/transcodes/jellyfin
# jellyfin-transcode-cleanup.timer: every 15 min, delete files older than this (minutes,
# at least 30). Active streams only keep recent segments anyway (SegmentKeepSeconds).
jellyfin_setup_transcode_max_age_min: 60
jellyfin_setup_transcode_cleanup_calendar: "*:0/15"

# Scheduled task triggers (Dashboard > Scheduled tasks), by task key; set exactly.
# "Clean Transcode Directory": at startup and every 24 h (Jellyfin's default, kept).
jellyfin_setup_task_triggers:
  DeleteTranscodeFiles:
    - { Type: StartupTrigger }
    - { Type: IntervalTrigger, IntervalTicks: 864000000000 } # 24 h in 100 ns ticks

# Server settings (Dashboard > General / Networking). Jellyfin 12 turns legacy
# authorization OFF by default, and then rejects API keys sent as X-Emby-Token,
# X-MediaBrowser-Token or ?api_key. The Sonarr/Radarr/Lidarr "Emby / Jellyfin"
# Connect notification sends X-MediaBrowser-Token, so the media wiring needs it on.
jellyfin_setup_system:
  EnableLegacyAuthorization: true

# The API key for the media wiring Job (Sonarr/Radarr/Lidarr "Connect"): created once
# under this app name.
jellyfin_setup_api_key_app: artzima-iac

# What the cluster needs from Jellyfin, kept in Infisical (k8s project) /k8s/media on every
# run: created when missing, updated when it differs (never printed). `var` names the
# variable that holds the value. The admin login is a copy of /operator (mirror_of in
# secrets.manifest.yaml): the wiring Job signs in to Seerr with it.
jellyfin_setup_k8s_secrets:
  - { name: JELLYFIN_API_KEY, var: jellyfin_setup_api_key, comment: "Jellyfin API key 'artzima-iac' (ansible jellyfin_setup role)" }
  - { name: JELLYFIN_ADMIN_USER, var: jellyfin_admin_user, comment: "mirror of /operator/JELLYFIN_ADMIN_USER (ansible jellyfin_setup role)" }
  - { name: JELLYFIN_ADMIN_PASSWORD, var: jellyfin_admin_password, comment: "mirror of /operator/JELLYFIN_ADMIN_PASSWORD (ansible jellyfin_setup role)" }

# Web theme (Dashboard > Branding > Custom CSS). The operator chose Zombie on 2026-11-24
# (github.com/MakD/zombie-release, built for Jellyfin 12; Finimalism didn't look right). Optional colour
# schemes go on extra @import lines (see its README). Empty = no theme.
jellyfin_setup_custom_css: '@import url(https://cdn.jsdelivr.net/gh/MakD/zombie-release@latest/zombie_revived.css);'
