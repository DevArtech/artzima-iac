---
# Jellyfin needs no clicks: first-run wizard, libraries, NVENC transcoding, reverse-proxy
# settings and the API key of the media wiring Job, all over Jellyfin's API on the LXC.
# Idempotent: every setting is read first and only written when it differs.
# Logins: Infisical /operator/JELLYFIN_ADMIN_USER / _PASSWORD (generated by make gen-secrets).
- name: Transcode folder on the NAS (mount checks, cleanup timer, no root-disk fallback)
  ansible.builtin.include_tasks: transcodes.yml

- name: Wait for Jellyfin's API
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/System/Info/Public"
    return_content: true
  register: jellyfin_setup_info
  until: jellyfin_setup_info.status == 200
  retries: 30
  delay: 5

# ---------------------------------------------------------------- first-run wizard
- name: First-run wizard
  when: not jellyfin_setup_info.json.StartupWizardCompleted
  block:
    - name: Read the wizard's server settings
      ansible.builtin.uri:
        url: "{{ jellyfin_setup_url }}/Startup/Configuration"
      register: jellyfin_setup_startup_now

    - name: Wizard - language and metadata country
      ansible.builtin.uri:
        url: "{{ jellyfin_setup_url }}/Startup/Configuration"
        method: POST
        body_format: json
        body: "{{ jellyfin_setup_startup_now.json | combine(jellyfin_setup_startup) }}"
        status_code: [200, 204]
      changed_when: true

    - name: Wizard - read the initial user (Jellyfin creates it on this call)
      ansible.builtin.uri:
        url: "{{ jellyfin_setup_url }}/Startup/User"
      register: jellyfin_setup_startup_user

    - name: Wizard - admin user from Infisical
      ansible.builtin.uri:
        url: "{{ jellyfin_setup_url }}/Startup/User"
        method: POST
        body_format: json
        body: { Name: "{{ jellyfin_admin_user }}", Password: "{{ jellyfin_admin_password }}" }
        status_code: [200, 204, 403]
      register: jellyfin_setup_startup_set
      changed_when: jellyfin_setup_startup_set.status != 403
      no_log: true

    # 403: someone already gave the wizard user a password (the unfinished wizard is
    # reachable on the public URL until this runs), and Jellyfin then refuses an
    # anonymous change. Nothing exists yet that could be lost, so take the user back
    # with Jellyfin's own local reset: the PIN file it writes on this host, redeemed,
    # makes the PIN the password; that login then sets the Infisical user + password.
    - name: Wizard - take back a wizard user that already has a password
      when: jellyfin_setup_startup_set.status == 403
      block:
        - name: Wizard - request a local password-reset PIN
          ansible.builtin.uri:
            url: "{{ jellyfin_setup_url }}/Users/ForgotPassword"
            method: POST
            body_format: json
            body: { EnteredUsername: "{{ jellyfin_setup_startup_user.json.Name }}" }
          register: jellyfin_setup_reset
          failed_when: jellyfin_setup_reset.json.Action | default('') != 'PinCode'

        - name: Wizard - read the PIN file
          ansible.builtin.slurp:
            src: "{{ jellyfin_setup_reset.json.PinFile }}"
          register: jellyfin_setup_pin_file
          no_log: true

        - name: Wizard - redeem the PIN (the PIN becomes the password)
          ansible.builtin.uri:
            url: "{{ jellyfin_setup_url }}/Users/ForgotPassword/Pin"
            method: POST
            body_format: json
            body: { Pin: "{{ (jellyfin_setup_pin_file.content | b64decode | from_json).Pin }}" }
          register: jellyfin_setup_redeem
          failed_when: not jellyfin_setup_redeem.json.Success | default(false)
          changed_when: true
          no_log: true

        - name: Wizard - log in with the PIN
          ansible.builtin.uri:
            url: "{{ jellyfin_setup_url }}/Users/AuthenticateByName"
            method: POST
            headers:
              Authorization: "{{ jellyfin_setup_client_header }}"
            body_format: json
            body:
              Username: "{{ jellyfin_setup_startup_user.json.Name }}"
              Pw: "{{ (jellyfin_setup_pin_file.content | b64decode | from_json).Pin }}"
          register: jellyfin_setup_pin_login
          no_log: true

        # /Startup/User refuses even an authenticated change now: use the user API.
        - name: Wizard - rename the user to the Infisical admin name
          vars:
            jellyfin_setup_pin_user: "{{ jellyfin_setup_pin_login.json.User }}"
          ansible.builtin.uri:
            url: "{{ jellyfin_setup_url }}/Users/{{ jellyfin_setup_pin_user.Id }}"
            method: POST
            headers:
              Authorization: '{{ jellyfin_setup_client_header }}, Token="{{ jellyfin_setup_pin_login.json.AccessToken }}"'
            body_format: json
            body: "{{ jellyfin_setup_pin_user | combine({'Name': jellyfin_admin_user}) }}"
            status_code: [200, 204]
          when: jellyfin_setup_pin_user.Name != jellyfin_admin_user
          changed_when: true
          no_log: true

        - name: Wizard - set the Infisical admin password
          ansible.builtin.uri:
            url: "{{ jellyfin_setup_url }}/Users/{{ jellyfin_setup_pin_login.json.User.Id }}/Password"
            method: POST
            headers:
              Authorization: '{{ jellyfin_setup_client_header }}, Token="{{ jellyfin_setup_pin_login.json.AccessToken }}"'
            body_format: json
            body:
              CurrentPw: "{{ (jellyfin_setup_pin_file.content | b64decode | from_json).Pin }}"
              NewPw: "{{ jellyfin_admin_password }}"
            status_code: [200, 204]
          changed_when: true
          no_log: true

    - name: Wizard - remote access on, no UPnP port mapping
      ansible.builtin.uri:
        url: "{{ jellyfin_setup_url }}/Startup/RemoteAccess"
        method: POST
        body_format: json
        body: { EnableRemoteAccess: true, EnableAutomaticPortMapping: false }
        status_code: [200, 204]
      changed_when: true

    - name: Wizard - complete
      ansible.builtin.uri:
        url: "{{ jellyfin_setup_url }}/Startup/Complete"
        method: POST
        status_code: [200, 204]
      changed_when: true

# ---------------------------------------------------------------- admin session
- name: Log in as the admin user
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/Users/AuthenticateByName"
    method: POST
    headers:
      Authorization: "{{ jellyfin_setup_client_header }}"
    body_format: json
    body: { Username: "{{ jellyfin_admin_user }}", Pw: "{{ jellyfin_admin_password }}" }
  register: jellyfin_setup_login
  no_log: true

- name: Keep the session header
  ansible.builtin.set_fact:
    jellyfin_setup_headers:
      Authorization: '{{ jellyfin_setup_client_header }}, Token="{{ jellyfin_setup_login.json.AccessToken }}"'
  no_log: true

# ---------------------------------------------------------------- libraries (never scanned here)
- name: Read the libraries
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/Library/VirtualFolders"
    headers: "{{ jellyfin_setup_headers }}"
  register: jellyfin_setup_libs
  no_log: "{{ jellyfin_setup_no_log }}"

- name: Create the missing libraries (no scan)
  ansible.builtin.uri:
    url: >-
      {{ jellyfin_setup_url }}/Library/VirtualFolders?name={{ item.name | urlencode }}&collectionType={{ item.type
      }}&paths={{ item.path | urlencode }}&refreshLibrary=false
    method: POST
    headers: "{{ jellyfin_setup_headers }}"
    body_format: json
    body: { LibraryOptions: { PathInfos: [{ Path: "{{ item.path }}" }] } }
    status_code: [200, 204]
  loop: "{{ jellyfin_setup_libraries }}"
  loop_control:
    label: "{{ item.name }} ({{ item.type }}, {{ item.path }})"
  when: item.name not in (jellyfin_setup_libs.json | map(attribute='Name') | list)
  changed_when: true

# ---------------------------------------------------------------- transcoding (NVENC)
- name: Read the encoding settings
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/System/Configuration/encoding"
    headers: "{{ jellyfin_setup_headers }}"
  register: jellyfin_setup_enc
  no_log: "{{ jellyfin_setup_no_log }}"

- name: Set NVENC, hardware decoding, tone mapping and the NAS transcode folder
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/System/Configuration/encoding"
    method: POST
    headers: "{{ jellyfin_setup_headers }}"
    body_format: json
    body: "{{ jellyfin_setup_enc.json | combine(jellyfin_setup_encoding) }}"
    status_code: [200, 204]
  when: jellyfin_setup_enc.json | combine(jellyfin_setup_encoding) != jellyfin_setup_enc.json
  changed_when: true
  no_log: "{{ jellyfin_setup_no_log }}"

# ---------------------------------------------------------------- scheduled tasks
- name: Read the scheduled tasks
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/ScheduledTasks"
    headers: "{{ jellyfin_setup_headers }}"
  register: jellyfin_setup_tasks
  no_log: "{{ jellyfin_setup_no_log }}"

# Compared on the fields we set (Jellyfin returns the rest as null).
- name: Set the scheduled task triggers
  vars:
    jellyfin_setup_task: "{{ jellyfin_setup_tasks.json | selectattr('Key', 'equalto', item.key) | first }}"
    jellyfin_setup_task_now: >-
      {{ jellyfin_setup_task.Triggers | map('dict2items')
         | map('selectattr', 'value', 'ne', none) | map('items2dict') | list }}
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/ScheduledTasks/{{ jellyfin_setup_task.Id }}/Triggers"
    method: POST
    headers: "{{ jellyfin_setup_headers }}"
    body_format: json
    body: "{{ item.value }}"
    status_code: [200, 204]
  loop: "{{ jellyfin_setup_task_triggers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: jellyfin_setup_task_now != item.value
  changed_when: true

# ---------------------------------------------------------------- server settings
- name: Read the server settings
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/System/Configuration"
    headers: "{{ jellyfin_setup_headers }}"
  register: jellyfin_setup_sys
  no_log: "{{ jellyfin_setup_no_log }}"

- name: Set the server settings (legacy API key headers for the arr Connect)
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/System/Configuration"
    method: POST
    headers: "{{ jellyfin_setup_headers }}"
    body_format: json
    body: "{{ jellyfin_setup_sys.json | combine(jellyfin_setup_system) }}"
    status_code: [200, 204]
  when: jellyfin_setup_sys.json | combine(jellyfin_setup_system) != jellyfin_setup_sys.json
  changed_when: true
  no_log: "{{ jellyfin_setup_no_log }}"

# ---------------------------------------------------------------- theme
- name: Read the branding settings
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/System/Configuration/branding"
    headers: "{{ jellyfin_setup_headers }}"
  register: jellyfin_setup_branding
  no_log: "{{ jellyfin_setup_no_log }}"

- name: Set the web theme (custom CSS)
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/System/Configuration/branding"
    method: POST
    headers: "{{ jellyfin_setup_headers }}"
    body_format: json
    body: "{{ jellyfin_setup_branding.json | combine({'CustomCss': jellyfin_setup_custom_css}) }}"
    status_code: [200, 204]
  when: (jellyfin_setup_branding.json.CustomCss | default('')) != jellyfin_setup_custom_css
  changed_when: true
  no_log: "{{ jellyfin_setup_no_log }}"

# ---------------------------------------------------------------- behind Traefik
# Traefik's requests reach the LXC from the Talos node IPs (SNAT), so those are the
# known proxies; clients are told the public URL.
- name: Read the network settings
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/System/Configuration/network"
    headers: "{{ jellyfin_setup_headers }}"
  register: jellyfin_setup_net
  no_log: "{{ jellyfin_setup_no_log }}"

- name: Set known proxies and the published server URL
  vars:
    jellyfin_setup_network:
      KnownProxies: "{{ groups['talos'] | map('extract', hostvars, 'lab_ip') | list }}"
      PublishedServerUriBySubnet: ["all=https://jellyfin.{{ public_domain }}"]
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/System/Configuration/network"
    method: POST
    headers: "{{ jellyfin_setup_headers }}"
    body_format: json
    body: "{{ jellyfin_setup_net.json | combine(jellyfin_setup_network) }}"
    status_code: [200, 204]
  when: jellyfin_setup_net.json | combine(jellyfin_setup_network) != jellyfin_setup_net.json
  changed_when: true
  no_log: "{{ jellyfin_setup_no_log }}"

# ---------------------------------------------------------------- API key -> Infisical
- name: Read the API keys
  ansible.builtin.uri:
    url: "{{ jellyfin_setup_url }}/Auth/Keys"
    headers: "{{ jellyfin_setup_headers }}"
  register: jellyfin_setup_keys
  no_log: true

- name: Create the API key
  when: jellyfin_setup_keys.json.Items | selectattr('AppName', 'equalto', jellyfin_setup_api_key_app) | list | length == 0
  block:
    - name: Create the API key for the media wiring
      ansible.builtin.uri:
        url: "{{ jellyfin_setup_url }}/Auth/Keys?app={{ jellyfin_setup_api_key_app | urlencode }}"
        method: POST
        headers: "{{ jellyfin_setup_headers }}"
        status_code: [200, 204]
      changed_when: true
      no_log: "{{ jellyfin_setup_no_log }}"

    - name: Read the API keys again
      ansible.builtin.uri:
        url: "{{ jellyfin_setup_url }}/Auth/Keys"
        headers: "{{ jellyfin_setup_headers }}"
      register: jellyfin_setup_keys_new
      no_log: true

- name: Pick the API key (the oldest one of that app)
  vars:
    # A skipped task still registers its result, hence the second name.
    jellyfin_setup_keys_now: "{{ jellyfin_setup_keys_new if jellyfin_setup_keys_new.json is defined else jellyfin_setup_keys }}"
  ansible.builtin.set_fact:
    jellyfin_setup_api_key: >-
      {{ (jellyfin_setup_keys_now.json.Items | selectattr('AppName', 'equalto', jellyfin_setup_api_key_app)
          | sort(attribute='DateCreated') | first).AccessToken }}
  no_log: true

# ---------------------------------------------------------------- Infisical /k8s/media
# The API key (ExternalSecret media/jellyfin-api) and copies of the /operator admin login
# (ExternalSecret media/jellyfin-admin, for the wiring Job's Seerr setup), rewritten on
# every run when they differ: a password changed in /operator reaches the cluster here.
- name: Keep the cluster's Jellyfin secrets in Infisical /k8s/media
  vars:
    jellyfin_setup_inf_auth: &jellyfin_setup_inf_auth
      url: "{{ artzima_infisical_url }}"
      universal_auth_client_id: "{{ lookup('ansible.builtin.env', 'INFISICAL_UNIVERSAL_AUTH_CLIENT_ID') }}"
      universal_auth_client_secret: "{{ lookup('ansible.builtin.env', 'INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET') }}"
      project_id: "{{ artzima_infisical_k8s_project }}"
      env_slug: "{{ artzima_infisical_env }}"
      path: /k8s/media
      secret_name: "{{ item.name }}"
  delegate_to: localhost
  become: false
  no_log: true # values, and the lookup reads the whole /k8s/media folder
  block:
    - name: Read Infisical /k8s/media
      ansible.builtin.set_fact:
        jellyfin_setup_inf_now: >-
          {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_k8s_project,
          env_slug=artzima_infisical_env, path='/k8s/media', as_dict=True)[0] | default({}, true) }}
    - name: Create the missing Infisical secrets
      infisical.vault.create_secret:
        <<: *jellyfin_setup_inf_auth
        secret_value: "{{ lookup('ansible.builtin.vars', item.var) }}"
        secret_comment: "{{ item.comment }}"
      loop: "{{ jellyfin_setup_k8s_secrets }}"
      when: item.name not in jellyfin_setup_inf_now
    - name: Update the Infisical secrets that differ
      infisical.vault.update_secret:
        <<: *jellyfin_setup_inf_auth
        secret_value: "{{ lookup('ansible.builtin.vars', item.var) }}"
      loop: "{{ jellyfin_setup_k8s_secrets }}"
      when:
        - item.name in jellyfin_setup_inf_now
        - jellyfin_setup_inf_now[item.name] != lookup('ansible.builtin.vars', item.var)
