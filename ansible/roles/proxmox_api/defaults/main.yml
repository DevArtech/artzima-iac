---
proxmox_api_user: terraform@pve
proxmox_api_token_name: tofu
proxmox_api_role: TofuProvisioner
# PVE 9 privilege names (VM.Monitor was replaced by VM.GuestAgent.*).
proxmox_api_privs:
  - Datastore.Allocate
  - Datastore.AllocateSpace
  - Datastore.AllocateTemplate
  - Datastore.Audit
  - Pool.Allocate
  - Pool.Audit
  - SDN.Use
  - Sys.Audit
  - Sys.Console
  - Sys.Modify
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.CPU
  - VM.Config.Cloudinit
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.Console
  - VM.GuestAgent.Audit
  - VM.Migrate
  - VM.PowerMgmt
  - VM.Snapshot
  - Mapping.Use

# Read-only token for prometheus-pve-exporter (k8s monitoring).
proxmox_api_exporter_user: prometheus@pve
proxmox_api_exporter_token_name: exporter

# Tokens are shown ONCE by pveum, so they go straight into Infisical (never to
# disk). A token is (re)issued when its Infisical secret is missing, or when
# proxmox_api_rotate=true (deletes and re-creates both tokens).
proxmox_api_rotate: false
# Where each token lands (folders must exist; docs/secrets.md):
#   /tofu/PROXMOX_API_TOKEN          "terraform@pve!tofu=<uuid>"  -> tofu (ephemeral)
#   /k8s/monitoring/PVE_EXPORTER_TOKEN  "<uuid>"                    -> ESO -> pve-exporter
proxmox_api_tofu_secret: { path: /tofu, name: PROXMOX_API_TOKEN, format: full }
proxmox_api_exporter_secret: { path: /k8s/monitoring, name: PVE_EXPORTER_TOKEN, format: value }
