---
tailscale_authkey_var: tailscale_authkey # name of the secret holding the key
tailscale_hostname: "{{ inventory_hostname }}"
tailscale_ssh: true
tailscale_accept_dns: true # MagicDNS
# Hosts never advertise routes: the ts-router LXCs do (group_vars/ts_routers).
tailscale_advertise_routes: []
tailscale_tags: []
tailscale_extra_args: []
