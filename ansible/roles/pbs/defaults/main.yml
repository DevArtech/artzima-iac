---
pbs_datastore_path: "/mnt/datastore/{{ pbs_datastore_name }}"
# Datastore disk by serial (hosts.yml pbs_datastore_disk_serial; tasks/datastore_disk.yml).
pbs_datastore_disk_serial: null
# ONE-TIME format opt-in (tasks/datastore_disk.yml). Set BOTH in hosts.yml for the first
# build only; the role refuses unless the confirmation equals the attached disk's serial.
# Afterwards set pbs_datastore_format_disk back to false (the label also prevents a repeat).
pbs_datastore_format_disk: false
pbs_datastore_format_confirm_serial: ""
pbs_datastore_fs_label: artzima-pbs # written after formatting (ext4 label, max 16 chars; xfs max 12)
# Whole-disk mode: formatting makes a GPT with TWO partitions, the datastore (p1, the rest of
# the disk) and the cache of the S3/B2 datastore (p2, this size, mounted at
# pbs_datastore_cache_mount; pbs_b2_cache_path lives below it). 0 = no cache partition.
# A disk still in the old single-partition layout is re-partitioned only with the one-time
# format opt-in above (it WIPES the datastore); otherwise the role refuses.
pbs_datastore_cache_gib: 100
pbs_datastore_cache_fs_label: artzima-pbscache # ext4 label (max 16 chars)
pbs_datastore_cache_part_name: artzima-pbs-cache # GPT partition name
pbs_datastore_part_name: artzima-pbs # GPT partition name of the datastore
pbs_datastore_cache_mount: /mnt/datastore-cache
# Shared disk (tasks/datastore_lv.yml): the OS and the datastore are on the SAME disk
# (install_disk_serial == pbs_datastore_disk_serial; install_lvm.hdsize caps the OS slice).
# The disk is never wiped by the role: the rest of it becomes LV pbs_datastore_lv in the
# OS volume group, formatted once; later runs reuse it and never format again.
pbs_os_on_datastore_disk: false
pbs_datastore_vg: pbs # the VG the PBS installer creates (named after the product)
pbs_datastore_lv: datastore
pbs_datastore_lv_fstype: ext4 # ext4 or xfs
pbs_datastore_lv_min_gib: 64 # refuse to build a datastore LV smaller than this
pbs_datastore_mount: "/mnt/datastore/{{ pbs_datastore_name }}"
pbs_datastore_mount_opts: defaults,nofail,x-systemd.device-timeout=30s
pbs_datastore_fs_types: [ext4, xfs]
pbs_datastore_fs_uuid: null # pick one filesystem if the disk has several
pbs_datastore_subdir: null # pick one datastore folder if the filesystem has several
pbs_datastore_search_depth: 3 # how deep below the filesystem root to look for .chunks
pbs_datastore_probe_dir: /run/artzima-pbs-probe
pbs_gc_schedule: "daily"
pbs_pve_user: pve@pbs
pbs_prune_jobs:
  - id: "{{ pbs_datastore_name }}-prune"
    schedule: "daily"
    keep_last: 3
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6
pbs_verify_jobs:
  - id: "{{ pbs_datastore_name }}-verify"
    schedule: "sat 05:00"
    outdated_after: 30
    ignore_verified: true
