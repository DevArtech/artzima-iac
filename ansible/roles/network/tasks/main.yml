---
- name: Validate VLAN id
  ansible.builtin.assert:
    that:
      - lab_vlan_id in [none, '', 'null'] or (lab_vlan_id | int >= 2 and lab_vlan_id | int <= 4094)
    fail_msg: "lab_vlan_id must be null (untagged) or 2-4094"

- name: Write /etc/network/interfaces
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload network

- name: Check whether tailscaled manages resolv.conf (MagicDNS)
  ansible.builtin.command: grep -q "generated by tailscale" /etc/resolv.conf
  register: network_resolv_tailscale
  changed_when: false
  failed_when: false

- name: Write DNS resolvers
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
  # Once Tailscale MagicDNS owns resolv.conf, leave it alone.
  when: network_resolv_tailscale.rc != 0
