---
# Proxmox only lets root@pam set raw devN: passthrough lines and bind-mount
# mpN: lines, and API tokens (OpenTofu) cannot. So OpenTofu creates the
# containers and this role adds devices and bind mounts from the inventory
# (lxc_devices / lxc_mounts on each LXC guest in hosts.yml).
- name: Collect LXCs placed on this node
  ansible.builtin.set_fact:
    lxc_devices_guests: >-
      {{ groups['all'] | map('extract', hostvars)
         | selectattr('guest_kind', 'defined') | selectattr('guest_kind', 'eq', 'lxc')
         | selectattr('proxmox_node', 'defined') | selectattr('proxmox_node', 'eq', inventory_hostname)
         | selectattr('lxc_devices', 'defined')
         | list }}
    lxc_devices_mount_guests: >-
      {{ groups['all'] | map('extract', hostvars)
         | selectattr('guest_kind', 'defined') | selectattr('guest_kind', 'eq', 'lxc')
         | selectattr('proxmox_node', 'defined') | selectattr('proxmox_node', 'eq', inventory_hostname)
         | selectattr('lxc_mounts', 'defined')
         | list }}

# ------------------------------------------------------------ media data folder
# The NAS media data folder (group_vars/all/media.yml), mounted READ-ONLY on
# the node, only where some LXC bind-mounts part of it (today: host01, Jellyfin).
- name: Mount the NAS media data folder read-only
  ansible.posix.mount:
    src: "{{ artnas_ip }}:{{ artnas_export }}/{{ media_data_subdir }}"
    path: "{{ media_host_mount }}"
    fstype: nfs
    opts: "{{ lxc_devices_media_mount_opts }}"
    state: mounted
  when: lxc_devices_mount_guests | length > 0

# Start guests only after network filesystems: otherwise Jellyfin would boot with
# a missing library. (A missing source dir makes `pct start` fail, which is the
# safe outcome: Jellyfin never sees an empty /data/media.)
- name: Drop-in directory for pve-guests
  ansible.builtin.file:
    path: /etc/systemd/system/pve-guests.service.d
    state: directory
    mode: "0755"
  when: lxc_devices_mount_guests | length > 0

- name: Order pve-guests after remote filesystems
  ansible.builtin.copy:
    dest: /etc/systemd/system/pve-guests.service.d/artzima-remote-fs.conf
    mode: "0644"
    content: |
      # Managed by Ansible (lxc_devices): LXC bind mounts come from NFS.
      [Unit]
      Wants=remote-fs.target
      After=remote-fs.target
  when: lxc_devices_mount_guests | length > 0
  register: lxc_devices_dropin

- name: Reload systemd after the drop-in changed # noqa: no-handler (one-off, inline)
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: lxc_devices_dropin is changed

# ------------------------------------------------------------ per guest
- name: Read container configs
  ansible.builtin.command: pct config {{ item.host_index }}
  loop: "{{ (lxc_devices_guests + lxc_devices_mount_guests) | unique(attribute='inventory_hostname') }}"
  loop_control:
    label: "{{ item.inventory_hostname }}"
  register: lxc_devices_cfg
  changed_when: false

- name: Add device and mount lines (devN / mpN = list index)
  ansible.builtin.include_tasks: guest.yml
  loop: "{{ lxc_devices_cfg.results }}"
  loop_control:
    loop_var: lxc_devices_res
    label: "{{ lxc_devices_res.item.inventory_hostname }}"
