---
- name: Detect product (pve or pbs)
  ansible.builtin.set_fact:
    common_product: "{{ 'pbs' if 'pbs_servers' in group_names else 'pve' }}"

- name: Disable enterprise and Ceph enterprise repos
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - pve-enterprise.sources
    - pbs-enterprise.sources
    - ceph.sources
    - pve-enterprise.list
    - pbs-enterprise.list
    - ceph.list
  notify: Apt update

- name: Add the no-subscription repo (deb822)
  ansible.builtin.template:
    src: no-subscription.sources.j2
    dest: "/etc/apt/sources.list.d/{{ common_product }}-no-subscription.sources"
    owner: root
    group: root
    mode: "0644"
  notify: Apt update

- name: Flush apt handlers
  ansible.builtin.meta: flush_handlers

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: 3600
  when: common_upgrade | bool
  register: common_upgrade_result

- name: Check whether a reboot is needed
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required

- name: Report pending reboot
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} needs a reboot (new kernel). Reboot nodes one at a time."
  when: common_reboot_required.stat.exists

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable chrony
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started

- name: Write /etc/hosts from the inventory
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: Authorize admin SSH keys for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ admin_ssh_keys | join('\n') }}"
    exclusive: false
    state: present

- name: Enforce key-only SSH (same as the first-boot hook)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-artzima.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
  notify: Reload ssh

# The Lenovo M83s' Intel I217-LM (e1000e) hangs under heavy traffic ("Detected Hardware Unit
# Hang"): the host stays up but its network freezes until a power cycle (build night,
# 2026-11-24). Turning off TSO/GSO/GRO on that NIC is the standard fix.
- name: Find the primary NIC's driver
  ansible.builtin.command: ethtool -i lan0
  register: common_lan0_driver
  changed_when: false
  failed_when: false

- name: Keep e1000e offloads off (I217 hardware-hang fix)
  ansible.builtin.copy:
    dest: /etc/systemd/system/e1000e-offload-off.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      [Unit]
      Description=Turn off lan0 TSO/GSO/GRO: the e1000e I217-LM hangs under load
      After=network-pre.target
      Before=network.target
      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/ethtool -K lan0 tso off gso off gro off
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
  when: "'driver: e1000e' in common_lan0_driver.stdout"
  register: common_e1000e_unit

- name: Enable the e1000e offload fix
  ansible.builtin.systemd_service:
    name: e1000e-offload-off.service
    enabled: true
    state: started
    daemon_reload: "{{ common_e1000e_unit is changed }}"
  when: "'driver: e1000e' in common_lan0_driver.stdout"
