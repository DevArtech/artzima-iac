---
- name: Apt update
  ansible.builtin.apt:
    update_cache: true

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Reload ssh
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Restart logind
  ansible.builtin.service:
    name: systemd-logind
    state: restarted
