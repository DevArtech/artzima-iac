---
storage_nfs_id: artnas
storage_nfs_content: backup,iso,vztmpl,snippets
storage_nfs_options: vers=3  # UGOS offers NFSv3 only (no v4 option), 2026-11-23
storage_pbs_id: pbs
storage_pbs_user: pve@pbs

# Cluster-wide backup job to PBS (PBS does pruning: see the pbs role).
storage_backup_jobs:
  - id: artzima-nightly
    schedule: "02:30"
    storage: pbs
    mode: snapshot
    all: 1
    # Talos nodes are cattle (rebuilt by OpenTofu); etcd is backed up separately.
    exclude: "{{ groups['talos'] | map('extract', hostvars, 'host_index') | join(',') }}"
    compress: zstd
    notes_template: "{{ '{{guestname}}' }}"
    prune_backups: keep-all=1

# Content types on local storage (no "import": nothing imports disk images any more).
storage_local_content: iso,vztmpl,backup
