[defaults]
inventory = hosts.yml
roles_path = roles
# Collections: `make deps` installs requirements.yml into the tools dir and
# exports ANSIBLE_COLLECTIONS_PATH; ./collections is a fallback.
collections_path = ./collections:~/.ansible/collections
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
forks = 10
# Secrets: group_vars/all/secrets.yml reads them from Infisical at runtime
# (infisical.vault lookups, universal auth from the environment).
vars_plugins_enabled = host_group_vars

[ssh_connection]
pipelining = True
