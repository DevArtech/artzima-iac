---
# Inside the Jellyfin LXC (Debian 13): NVIDIA userspace from NVIDIA's repo at exactly
# host01's driver version (nvidia_driver_version), plus Jellyfin from the official repo.
- name: Bootstrap python3 in fresh Debian LXCs
  hosts: jellyfin
  gather_facts: false
  tasks:
    - name: Install python3 if missing
      ansible.builtin.raw: test -x /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      register: lxc_py
      changed_when: "'Setting up python3' in lxc_py.stdout"

- name: Jellyfin with NVENC
  hosts: jellyfin
  vars:
    jellyfin_nvidia_userspace:
      - "nvidia-smi={{ nvidia_driver_version }}-*"
      - "libnvidia-encode1={{ nvidia_driver_version }}-*"
      - "libcuda1={{ nvidia_driver_version }}-*"
      - "libnvcuvid1={{ nvidia_driver_version }}-*"
  tasks:
    - name: Enable contrib/non-free in debian.sources
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/debian.sources
        regexp: '^Components: .*$'
        replace: 'Components: main contrib non-free non-free-firmware'

    - name: NVIDIA apt repository (cuda-keyring)
      ansible.builtin.apt:
        deb: "{{ nvidia_repo_url }}/cuda-keyring_1.1-1_all.deb"

    - name: Pin the NVIDIA userspace to host01's driver version
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/nvidia-driver
        mode: "0644"
        content: |
          Package: nvidia-* libnvidia-* libcuda1 libnvcuvid1
          Pin: version {{ nvidia_driver_version }}-*
          Pin-Priority: 1001

    - name: Jellyfin apt key
      ansible.builtin.get_url:
        url: https://repo.jellyfin.org/jellyfin_team.gpg.key
        dest: /etc/apt/keyrings/jellyfin.asc
        mode: "0644"

    - name: Jellyfin repo
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/jellyfin.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://repo.jellyfin.org/debian
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: main
          Signed-By: /etc/apt/keyrings/jellyfin.asc

    - name: Install NVIDIA userspace and Jellyfin
      ansible.builtin.apt:
        name: "{{ jellyfin_nvidia_userspace + ['jellyfin', 'nfs-common'] }}"
        state: present
        update_cache: true

    - name: Enable Jellyfin
      ansible.builtin.service:
        name: jellyfin
        enabled: true
        state: started
    # Media library: /data/media (read-only bind mount of the NAS media data
    # folder, set by `make lxc-devices` from lxc_mounts in hosts.yml). Transcodes:
    # /data/transcodes (read-write bind mount of the NAS folder data/transcodes, made by
    # `make nas-folders`; Jellyfin refuses to start without it). The wizard, libraries,
    # NVENC, transcode folder + cleanup, proxies and the API key: role jellyfin_setup (below).

    - name: Check the media library mount
      ansible.builtin.stat:
        path: /data/media
      register: jellyfin_media

    - name: Warn if the media library is not mounted yet
      ansible.builtin.debug:
        msg: "/data/media is missing: run `make lxc-devices` (after the NAS data folder exists, docs/manual-steps.md §3)"
      when: not jellyfin_media.stat.exists

    - name: Configure Jellyfin (transcodes on the NAS, wizard, libraries, NVENC, proxies, API key)
      ansible.builtin.include_role:
        name: jellyfin_setup
