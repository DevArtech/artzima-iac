---
# Every Ansible secret, read from Infisical AT RUNTIME (docs/secrets.md).
# Nothing secret is in this file: only where each value lives. Variables are
# lazy, so a playbook only fetches what it actually uses.
#
# Auth: universal-auth machine identity "artzima-admin", from the environment
#   INFISICAL_UNIVERSAL_AUTH_CLIENT_ID / INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET
# (`make <playbook>` loads ~/.config/artzima/infisical.env and
# infisical-project.env through scripts/infisical_exec.py; paths overridable with
# $ARTZIMA_INFISICAL_ENV / $ARTZIMA_INFISICAL_PROJECT). Host/project/env from
# INFISICAL_HOST / INFISICAL_PROJECT_ID / INFISICAL_ENV, else infisical.yml.
artzima_infisical_url: "{{ lookup('ansible.builtin.env', 'INFISICAL_HOST') or infisical_host }}"
artzima_infisical_project: "{{ lookup('ansible.builtin.env', 'INFISICAL_PROJECT_ID') or infisical_project_id }}"
artzima_infisical_env: "{{ lookup('ansible.builtin.env', 'INFISICAL_ENV') or infisical_env }}"

# ---- /settings: private, not secret -------------------------------------------
admin_ssh_keys: >-
  {{ (query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/settings', secret_name='ADMIN_SSH_KEYS')[0].value).splitlines()
  | map('trim') | select | list }}

# ---- /ansible -----------------------------------------------------------------
# NUT (upsd.users). monuser/secret stays fixed in the nut role: the UGREEN NAS
# can't be configured with other credentials.
nut_upsmon_primary_password: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NUT_UPSMON_PRIMARY_PASSWORD')[0].value }}
nut_upsmon_secondary_password: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NUT_UPSMON_SECONDARY_PASSWORD')[0].value }}

# Tailscale: reusable, pre-approved, tagged auth keys (tag:artzima / tag:subnet-router).
tailscale_authkey: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='TAILSCALE_AUTHKEY')[0].value }}
tailscale_router_authkey: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='TAILSCALE_ROUTER_AUTHKEY')[0].value }}

# PBS: password of pve@pbs (the PVE "pbs" storage login) and the PBS certificate
# fingerprint (after `make pbs`: proxmox-backup-manager cert info | grep Fingerprint).
pbs_pve_user_password: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='PBS_PVE_USER_PASSWORD')[0].value }}
pbs_fingerprint: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='PBS_FINGERPRINT')[0].value }}
# PBS -> Backblaze B2: the pbs bucket's scoped application key, written into
# Infisical by OpenTofu (`make b2-apply`, tofu/backblaze). Used by `make pbs-offsite`.
pbs_b2_key_id: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='PBS_B2_KEY_ID')[0].value }}
pbs_b2_application_key: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='PBS_B2_APPLICATION_KEY')[0].value }}

# ---- NAS media + personal files: Backrest (restic) on the NAS (role nas_backup,
# `make nas-backup`, docs/backups.md). The B2 key is written by `make b2-apply`.
nas_b2_key_id: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NAS_B2_KEY_ID')[0].value }}
nas_b2_application_key: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NAS_B2_APPLICATION_KEY')[0].value }}
# restic repository password: keep a copy OUTSIDE the lab (no password = no restore).
nas_restic_password: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NAS_RESTIC_PASSWORD')[0].value }}
# Backrest web UI login: user + base64(bcrypt(password)); the plaintext stays in your password manager.
nas_backrest_user: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NAS_BACKREST_USER')[0].value }}
nas_backrest_password_bcrypt: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NAS_BACKREST_PASSWORD_BCRYPT')[0].value }}
# MAINTENANCE key of the nas bucket (forget/prune, the maintenance container); Backrest
# itself only has the backup key above.
nas_b2_maint_key_id: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NAS_B2_MAINT_KEY_ID')[0].value }}
nas_b2_maint_application_key: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NAS_B2_MAINT_APPLICATION_KEY')[0].value }}
# THE alert endpoint (may be EMPTY = off), shared with Alertmanager: an https URL.
# Backrest gets it as a Shoutrrr generic webhook (generic+https://...).
alert_webhook_url: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/k8s/alerts', secret_name='WEBHOOK_URL')[0].value }}
# Dead-man switch (may be EMPTY = off): healthchecks.io ping-key base, https://hc-ping.com/<ping-key>.
nas_backup_healthchecks_url: >-
  {{ query('infisical.vault.read_secrets', url=artzima_infisical_url, project_id=artzima_infisical_project,
  env_slug=artzima_infisical_env, path='/ansible', secret_name='NAS_BACKUP_HEALTHCHECKS_URL')[0].value }}
